        <span style="flex:1"></span>
        <button class="mini-btn" id="finBtn2">Finaliser mon projet →</button>
      </div>
      <div class="frame-wrap"><div class="frame-bar"><i></i><i></i><i></i></div>
        <div class="frame-holder"><div class="frame" id="frame"><div class="site-scroll" id="siteScroll"></div></div></div>
      </div>
    </div>
  </div>
  <div class="drawerbar" id="drawerbar">
    <b id="drawerPct">0 %</b>
    <span class="mini-pbar"><i id="drawerFill" style="width:0%"></i></span>
    <button class="btn" id="drawerOpen">Mes chantiers</button>
  </div>`;
  const panel = $('#panel'), scrim = $('#scrim');
  const closeDrawer = ()=>{ panel.classList.remove('open'); scrim.classList.remove('on'); };
  $('#drawerOpen').onclick = ()=>{ panel.classList.add('open'); scrim.classList.add('on'); };
  scrim.onclick = closeDrawer;
  S.closeDrawer = closeDrawer;
  $('#devices').addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    S.device = b.dataset.d;
    document.querySelectorAll('#devices button').forEach(x=>x.classList.toggle('sel',x===b));
    $('#deviceTag').textContent = 'VUE '+({desktop:'ORDINATEUR',tablet:'TABLETTE',mobile:'MOBILE'})[S.device];
    fitFrame();
    if(S.device==='mobile') showMsg('Votre site est déjà parfaitement adapté au téléphone.');
  });
  $('#finBtn2').onclick = openRecap;
  addEventListener('resize', fitFrame);
  paintSite(); renderPanel('home');
  scrollTo({top:0,behavior:'auto'}); setTimeout(updateScrollCue,80);
  refreshPanelHead();
  if(welcome) setTimeout(()=>showMsg(welcome), 600);
  setTimeout(()=>showMsg('Votre site est là. Chaque chantier ci-contre l’améliore — dans l’ordre que vous voulez.'), welcome?4200:600);
}
function fitFrame(){
  const frame = $('#frame'); if(!frame) return;
  const holder = frame.parentElement;
  const w = {desktop:null,tablet:768,mobile:390}[S.device];
  if(!w){ frame.style.width='100%'; frame.style.transform=''; holder.style.height=''; return; }
  frame.style.width = w+'px';
  const avail = holder.clientWidth;
  const sc = avail < w ? avail/w : 1;
  frame.style.transform = sc<1?`scale(${sc})`:''; frame.style.transformOrigin='top center';
  holder.style.height = sc<1 ? (frame.offsetHeight*sc)+'px' : '';
}
function paintSite(){
  const sc = $('#siteScroll'); if(!sc) return;
  const y = sc.scrollTop;
  sc.innerHTML = renderSite({editable:true, hidden:true});
  sc.scrollTop = y;
  // les sections déjà à l'écran apparaissent tout de suite, les autres au défilement
  setTimeout(()=>observeSections(sc), 0);
  sc.querySelectorAll('[data-bind]').forEach(el=>{
    el.addEventListener('input', ()=>{ bindEdit(el.dataset.bind, el.textContent); });
    el.addEventListener('blur', ()=>{ flashSaved(); });
  });
  fitFrame();
}
function bindEdit(key, val){
  if(key==='heroHeading') S.site.heroHeading = val;
  if(key==='heroSub'){ S.site.heroSub = val; S.comp.identite=100; }
  if(key==='about'){ S.site.about = val; if(val.trim().length>60) setComp('apropos',100); }
  scheduleAutosave();
}
let autosaveT=null;
function scheduleAutosave(){ clearTimeout(autosaveT);
  autosaveT=setTimeout(()=>{ flashSaved(); refreshPanelHead(); sauvegarderBrouillon(); }, 900); }
/* Par défaut la complétion ne recule pas : la progression doit rester encourageante.
   Avec `exact`, on force la valeur réelle — un chantier ne doit pas afficher 20 %
   quand le client vient de tout retirer. La barre globale, elle, garde son cliquet (S.maxPct). */
function setComp(k,v,exact){ if(exact || v>(S.comp[k]||0)){ S.comp[k]=v; } refreshPanelHead(); }
function refreshPanelHead(){
  const pct = globalPct();
  const el = $('#gpct'); if(el){ el.textContent = pct; $('#pbarFill').style.width=pct+'%'; }
  const dp = $('#drawerPct'); if(dp){ dp.textContent = pct+' %'; $('#drawerFill').style.width=pct+'%'; }
  const list = $('#chantierList'); if(list && $('#panel').dataset.view==='home') list.innerHTML = chantiersHtml();
  if(pct>=60&&!S._m60){ S._m60=1; showMsg('Votre site a maintenant une vraie identité.'); }
  if(pct>=80&&!S._m80){ S._m80=1; showMsg('Encore un chantier et votre maquette sera complète.'); }
}
function chantiersHtml(){
  return CHANTIERS.map(([k,label,sub])=>{
    const v = S.comp[k]||0; const st = v>=100?'done':v>0?'part':'todo';
    const ico = v>=100?'✓':v>0?'◐':'○';
    return `<button class="chantier" data-k="${k}"><span class="st ${st}">${ico}</span>
      <span><b>${label==='SERVICES_LABEL'?svcLabel():label}</b><small>${sub}</small></span>
      <span class="cpct">${v}%</span></button>`;
  }).join('');
}
function renderPanel(view){
  const panel = $('#panel'); panel.dataset.view = view;
  const pct = globalPct();
  const head = `<div class="panel-head">
    <div class="pct-row"><h2>${esc(S.name)}</h2><span class="pct"><span id="gpct">${pct}</span><small> %</small></span></div>
    <div class="pbar"><i id="pbarFill" style="width:${pct}%"></i></div></div>
    <div class="msgbox" id="msgbox"></div>`;
  if(view==='home'){
    panel.innerHTML = head + `<div class="chantiers" id="chantierList">${chantiersHtml()}</div>
      <button class="btn finish" id="finBtn">Finaliser mon projet →</button>
      <p class="finish-note">Vous pourrez tout relire avant l'envoi. Rien n'est définitif.</p>
      <p class="statut-note">Ce que vous construisez ici est une <b>maquette de travail</b> : elle sert de point de départ.
        Une fois envoyée, elle est entièrement reprise et retravaillée par nos soins pour devenir votre vrai site.</p>`;
    $('#chantierList').addEventListener('click', e=>{
      const b = e.target.closest('.chantier'); if(!b) return;
      openChantier(b.dataset.k);
    });
    $('#finBtn').onclick = openRecap;
  } else {
    panel.innerHTML = head + `<button class="ed-back" id="edBack">←&nbsp; Tous les chantiers</button><div class="ed" id="ed">${EDITORS[view]()}</div>`;
    $('#edBack').onclick = ()=>renderPanel('home');
    bindEditor(view);
  }
}
function openChantier(k){
  S.visited[k]=1;
  renderPanel(k);
  const target = document.querySelector(`#siteScroll [data-sec="${({identite:'hero',univers:'hero',services:'services',photos:'photos',apropos:'apropos',contact:'contact',reseaux:'contact',pages:'hero'})[k]}"]`);
  if(target){
    target.classList.remove('pre');
    target.scrollIntoView({behavior:'smooth',block:'start'});
    target.classList.remove('hl'); void target.offsetWidth; target.classList.add('hl');
    if(isNarrow()){   // sur mobile : on referme le tiroir pour laisser voir le changement
      S.closeDrawer && S.closeDrawer();
      setTimeout(()=>{ const fw=document.querySelector('.frame-wrap');
        fw && fw.scrollIntoView({behavior:'smooth',block:'start'}); }, 120);
    }
  }
  if(k==='pages') setComp('pages',70);
}

function bindEditor(view){
  const upd = ()=>{ paintSite(); scheduleAutosave(); };
  if(view==='identite'){
    $('#f-name').addEventListener('input', e=>{ S.name=e.target.value; upd(); });
    $('#f-tag').addEventListener('input', e=>{ S.site.heroSub=e.target.value; upd(); });
    $('#ai-tag').onclick = ()=>{ aiRewrite('tagline'); };
  }
  if(view==='univers'){
    const paintSws = ()=>{
      const cols = PALETTES[S.theme];
      $('#sws').innerHTML = cols.map((c,i)=>`<button class="sw${S.palette===i?' sel':''}" data-p="${i}" style="background:${c}" aria-label="Palette ${i+1}"></button>`).join('');
      document.querySelectorAll('.sw').forEach(b=>b.onclick=()=>{ S.palette=+b.dataset.p; paintSws(); upd(); showMsg('Nouvelle palette appliquée à tout votre site.'); });
    };
    document.querySelectorAll('.tchip').forEach(b=>b.onclick=()=>{ S.theme=b.dataset.t; S.palette=0;
      document.querySelectorAll('.tchip').forEach(x=>x.classList.toggle('sel',x===b)); paintSws(); upd(); });
    $('#fpSeg').addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b) return;
      S.fontPair=+b.dataset.f; document.querySelectorAll('#fpSeg button').forEach(x=>x.classList.toggle('sel',x===b)); upd(); });
    const NB_LAY = 5*4*3*3*2;
    $('#reLayout').onclick = ()=>{
      S.laySeed = (S.laySeed+1) % NB_LAY;
      S.layout = pickLayout(S.packSlug, S.laySeed, S.adn, S.empreinte);
      $('#compoTxt').textContent = layoutSummary(S.layout);
      $('#compoN').innerHTML = `${S.laySeed+1}<small> / ${NB_LAY}</small>`;
      upd();
      const sc = $('#siteScroll'); if(sc) sc.scrollTo({top:0,behavior:'smooth'});
      showMsg('Nouvelle composition — même contenu, structure différente.');
    };
    paintSws(); setComp('univers',100);
  }
  if(view==='services'&&S.packSlug!=='restaurant'){
    $('#svcRows').addEventListener('input', e=>{
      const row = e.target.closest('.svc-row'); if(!row) return;
      const i = +row.dataset.i, f = e.target.dataset.f;
      S.site.services[i][f] = e.target.value; setComp('services',100); upd();
    });
    $('#addSvc').onclick = ()=>{ S.site.services.push({name:'Nouveau service',desc:'Décrivez-le en une phrase.'});
      renderPanel('services'); upd(); };
  }
  if(view==='services'&&S.packSlug==='restaurant'){ setComp('services',100); }
  if(view==='photos'){
    let target=null;
    const fi = $('#fileInput');
    $('#ed').addEventListener('click', e=>{
      const b = e.target.closest('[data-up]'); if(!b) return; target=b.dataset.up; fi.click(); });
    fi.addEventListener('change', async ()=>{
      const f = fi.files[0]; if(!f){ return; }
      fi.value = '';                              // sans ça, rechoisir le même fichier ne déclenche rien
      if(f.size > 12*1024*1024){ showMsg('Fichier trop lourd (12 Mo maximum).'); return; }
      if(!/^image\//.test(f.type)){ showMsg('Ce fichier n’est pas une image.'); return; }
      const cible = target;                        // figé : l'utilisateur peut cliquer ailleurs pendant le traitement
      showMsg('Traitement de votre image…');
      let url;
      try { url = await imageEnDataURL(f, cible==='logo' ? 'logo' : 'photo'); }
      catch { showMsg('Cette image n’a pas pu être lue. Essayez un autre fichier.'); return; }
      if(cible==='logo'){
        S.site.logo = url;
        // sur fond sombre, un logo brut disparaît souvent : on propose d'emblée la pastille
        if(sombreActif() && (S.site.logoMode||'tel-quel')==='tel-quel') S.site.logoMode = 'pastille';
        showMsg('Votre logo est en place, en haut de votre site.');
      }
      else if(cible==='hero'){ S.site.heroImg=url; showMsg('Votre image est en place — le site est tout de suite plus vous.'); }
      else { S.site.gallery[+cible]=url; showMsg('Votre image est en place — le site est tout de suite plus vous.'); }
      majCompletionVisuels();
      renderPanel('photos'); upd(); sauvegarderBrouillon();
    });
    $('#ed').addEventListener('click', e=>{
      const b = e.target.closest('#logoMode button'); if(!b) return;
      S.site.logoMode = b.dataset.m; renderPanel('photos'); upd();
    });
    const btnRetirer = $('#logoRetirer');
    if(btnRetirer) btnRetirer.onclick = ()=>{ S.site.logo=null; S.site.logoMode='tel-quel';
      majCompletionVisuels(); renderPanel('photos'); upd(); };
    $('#skipPhotos').onclick = ()=>{ S.photosPassees = true; majCompletionVisuels();
      renderPanel('home'); showMsg('C’est noté — nous choisirons les visuels ensemble.'); };
  }
  if(view==='apropos'){
    $('#f-about').addEventListener('input', e=>{ S.site.about=e.target.value;
      if(e.target.value.trim().length>60) setComp('apropos',100); upd(); });
    $('#ai-about').onclick = ()=>aiRewrite('about');
  }
  if(view==='contact'){
    const map = {'f-phone':'phone','f-cmail':'email','f-addr':'address','f-hours':'hours'};
    for(const id in map) $('#'+id).addEventListener('input', e=>{
      S.site.contact[map[id]] = e.target.value;
      const c=S.site.contact; if((c.phone||c.email)&&c.address) setComp('contact',100);
      else if(c.phone||c.email||c.address) setComp('contact',60); upd(); });
  }
  if(view==='reseaux'){
    $('#f-insta').addEventListener('input', e=>{ S.site.socials.instagram=e.target.value.trim(); if(e.target.value) setComp('reseaux',100); upd(); });
    $('#f-fb').addEventListener('input', e=>{ S.site.socials.facebook=e.target.value.trim(); if(e.target.value) setComp('reseaux',100); upd(); });
  }
  if(view==='pages'){
    $('#pageRows').addEventListener('change', e=>{
      const cb = e.target; if(cb.type!=='checkbox') return;
      S.site.pages[+cb.dataset.i].on = cb.checked; setComp('pages',100); upd(); });
    $('#addPage').onclick = ()=>{
      const v = $('#f-newpage').value.trim(); if(!v) return;
      S.site.pages.push({slug:v.toLowerCase(),label:v,reason:'Page personnalisée — nous en discuterons ensemble.',on:true,custom:true});
      setComp('pages',100); renderPanel('pages'); upd(); showMsg('Page « '+v+' » ajoutée à votre plan de site.');
    };
  }
}
function aiRewrite(what){
  if(S.aiUses>=6){ showMsg('Limite de reformulations atteinte pour ce prototype.'); return; }
  S.aiUses++;
  const p = pack();
  if(what==='about'){
    const alts=[p.about,...(p.aboutAlt||[])];
    S.site.aboutIdx=(S.site.aboutIdx+1)%alts.length; S.site.about=alts[S.site.aboutIdx];
    const f=$('#f-about'); if(f) f.value=S.site.about;
  } else {
    const h=(p.hero[S.specialization]||p.hero.default);
    const alts=[h[1], S.diff?S.diff:'Un accompagnement attentif, du premier échange au résultat final.', 'Une approche simple : bien faire, et le faire savoir.'];
    const cur=alts.indexOf(S.site.heroSub); S.site.heroSub=alts[(cur+1)%alts.length];
    const f=$('#f-tag'); if(f) f.value=S.site.heroSub;
  }
  paintSite(); scheduleAutosave(); showMsg('Nouvelle proposition appliquée — recommencez pour en voir une autre.');
}

/* ================= ANTI-ROBOT (Cloudflare Turnstile) =================
   Le composant produit un jeton que la fonction serveur vérifie. Sans clé
   publique renseignée, tout ce bloc reste inerte : le parcours fonctionne
   exactement comme avant. */
let turnstilePret = null;
function chargerTurnstile(){
  if (turnstilePret) return turnstilePret;
  turnstilePret = new Promise((resolve, reject) => {
    if (window.turnstile) return resolve(window.turnstile);
    const s = document.createElement('script');
    s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
    s.async = true; s.defer = true;
    s.onload = () => window.turnstile ? resolve(window.turnstile) : reject(new Error('Turnstile indisponible'));
    s.onerror = () => reject(new Error('Turnstile injoignable'));
    document.head.appendChild(s);
    setTimeout(() => reject(new Error('Turnstile n’a pas répondu')), 12000);
  });
  return turnstilePret;
}
// affiché dans le récapitulatif, au moment où le client s'apprête à envoyer
async function poserTurnstile(){
  const zone = $('#turnstileZone');
  if (!zone || !CONFIG.turnstileSiteKey || !enLigne()) return;
  try {
    const ts = await chargerTurnstile();
    window.__turnstileToken = '';
    ts.render(zone, {
      sitekey: CONFIG.turnstileSiteKey,
      theme: 'auto',
      language: 'fr',
      callback: t => { window.__turnstileToken = t; },
      // le jeton expire au bout de quelques minutes : on en redemande un
      'expired-callback': () => { window.__turnstileToken = ''; ts.reset(zone); },
      'error-callback': () => { window.__turnstileToken = ''; },
    });
  } catch (e) {
    // Cloudflare injoignable : on le dit plutôt que de laisser un échec inexpliqué à l'envoi
    zone.innerHTML = `<div class="envoi-ko">La vérification anti-robot n’a pas pu se charger
      (${esc(e.message)}). Réessayez, ou désactivez votre bloqueur de publicité.</div>`;
  }
}

/* Envoi réel vers la fonction serveur. Renvoie la référence attribuée. */
async function envoyerProjet(){
  // le serveur refusera sans jeton : autant l'expliquer ici, en clair
  if (CONFIG.turnstileSiteKey && !window.__turnstileToken) {
    throw new Error('vérification anti-robot pas encore terminée, patientez deux secondes');
  }
  const corps = {
    etat: { packSlug:S.packSlug, metierLabel:S.metierLabel, specialization:S.specialization,
      name:S.name, goal:S.goal, diff:S.diff, theme:S.theme, palette:S.palette, fontPair:S.fontPair,
      adn:S.adn, empreinte:S.empreinte, layout:S.layout, site:S.site, comp:S.comp },
    email: S.email || '',
    pct: globalPct(),
    budget: S.qBudget || '',
    echeance: S.qEcheance || '',
    turnstile: window.__turnstileToken || '',
    piege: $('#piege')?.value || '',     // champ appât : un humain ne le remplit jamais
  };
  const r = await fetch(`${CONFIG.apiBase}/api/projet`, {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(corps),
  });
  const d = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(d.erreur || `Erreur ${r.status}`);
  return d.ref;
}

/* ---------------------------------------------------------------------
   Source des projets : Supabase quand la configuration est renseignée,
   mémoire sinon. Le reste de l'écran ne fait aucune différence entre les deux.
   --------------------------------------------------------------------- */
async function chargerProjets(){
  if (!enLigne()) return PROJETS;
  const lignes = await SB.requete('projets?select=id,ref,cree_le,statut,pct,nom,email,telephone,metier,specialite,budget,echeance&order=cree_le.desc');
  return lignes.map(l => ({
    id:l.id, ref:l.ref, statut:l.statut, pct:l.pct, nom:l.nom, email:l.email, tel:l.telephone,
    metier:l.metier, specialite:l.specialite, budget:l.budget, echeance:l.echeance,
    date:new Date(l.cree_le).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'}),
    etat:null,   // chargé à l'ouverture de la fiche
  }));
}
async function chargerProjet(ref){
  if (!enLigne()) return PROJETS.find(p=>p.ref===ref);
  const [l] = await SB.requete(`projets?ref=eq.${encodeURIComponent(ref)}&select=*`);
  if (!l) return null;
  const [messages, historique] = await Promise.all([
    SB.requete(`messages?projet_id=eq.${l.id}&select=*&order=cree_le.asc`),
    SB.requete(`historique?projet_id=eq.${l.id}&select=*&order=cree_le.asc`),
  ]);
  return {
    id:l.id, ref:l.ref, statut:l.statut, pct:l.pct, nom:l.nom, email:l.email, tel:l.telephone,
    budget:l.budget, echeance:l.echeance, etat:l.etat,
    date:new Date(l.cree_le).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'}),
    messages: messages.map(m=>({de:m.expediteur, t:m.texte, d:new Date(m.cree_le).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'})})),
    historique: historique.map(h=>({q:h.evenement, d:new Date(h.cree_le).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'})})),
  };
}
async function changerStatut(p, statut){
  p.statut = statut;
  p.historique.push({q:'Passé en « '+nomStatut(statut)+' »', d:'aujourd’hui'});
  if (!enLigne()) return;
  await SB.requete(`projets?id=eq.${p.id}`, { method:'PATCH', headers:{Prefer:'return=minimal'},
    body: JSON.stringify({ statut }) });
  await SB.requete('historique', { method:'POST', headers:{Prefer:'return=minimal'},
    body: JSON.stringify({ projet_id:p.id, evenement:'Passé en « '+nomStatut(statut)+' »', auteur:'atelier' }) });
}
async function envoyerMessage(p, texte){
  if (!enLigne()) { p.messages.push({de:'atelier', t:texte, d:'aujourd’hui'});
    p.historique.push({q:'Message envoyé au client', d:'aujourd’hui'}); return; }
  const r = await fetch(`${CONFIG.apiBase}/api/message`, {
    method:'POST',
    headers:{'Content-Type':'application/json', Authorization:`Bearer ${SB.session.access_token}`},
    body: JSON.stringify({ projet_id:p.id, texte }),
  });
  const d = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(d.erreur || `Erreur ${r.status}`);
  p.messages.push({de:'atelier', t:texte, d:'aujourd’hui'});
  p.historique.push({q:'Message envoyé au client', d:'aujourd’hui'});
}

        <span class="tag" style="font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)">Visuels</span>
        <div class="seg" style="margin:0;width:auto" id="admVisuels">
          <button data-v="banque" class="${VISUELS.mode==='banque'?'sel':''}">Photos</button>
          <button data-v="degrade" class="${VISUELS.mode==='degrade'?'sel':''}">Dégradés</button>
        </div>
        <button class="btn-ghost" id="admSortie">Retour au site public</button>
      </div>
    </div>
    <div class="adm-stats">
      <button class="adm-stat${filtre==='tous'?' actif':''}" data-f="tous"><b>${source.length}</b><span>Tous</span></button>
      ${STATUTS.map(([k,l])=>`<button class="adm-stat${filtre===k?' actif':''}" data-f="${k}"><b>${n(k)}</b><span>${l}</span></button>`).join('')}
    </div>
    ${liste.length?`<div class="adm-table">
      <div class="adm-row entete"><span>Réf.</span><span>Client</span><span>Activité</span><span>Maquette</span><span>Statut</span><span>Reçu le</span></div>
      ${liste.map(p=>`<button class="adm-row" data-ref="${esc(p.ref)}">
        <span class="ref">${esc(p.ref)}</span>
        <span class="nom">${esc(p.nom || p.etat?.name || '—')}<small>${esc(p.email||'email non renseigné')}</small></span>
        <span class="meta">${esc(p.metier || p.etat?.metierLabel || '—')}${(p.specialite||p.etat?.specialization)?' · '+esc(p.specialite||p.etat.specialization):''}</span>
        <span class="pct">${p.pct} %</span>
        <span><span class="pill ${p.statut}">${esc(nomStatut(p.statut))}</span></span>
        <span class="meta date">${esc(p.date)}</span>
      </button>`).join('')}
    </div>`:`<div class="adm-table"><div class="adm-vide"><b>Aucun projet à ce statut</b>Changez de filtre pour voir les autres.</div></div>`}
  </div>`,
  ()=>{
    document.querySelectorAll('.adm-stat').forEach(b=>b.onclick=()=>{ S.admFiltre=b.dataset.f; SCREENS.admin(); });
    document.querySelectorAll('.adm-row[data-ref]').forEach(b=>b.onclick=()=>{ S.admRef=b.dataset.ref; go('adminProjet'); });
    $('#admVisuels').addEventListener('click', ev=>{
      const b = ev.target.closest('button'); if(!b) return;
      VISUELS.mode = b.dataset.v; SCREENS.admin();
    });
    $('#admSortie').onclick = ()=>{ if(enLigne()) SB.deconnexion(); S.admProjets=null; go('landing'); };
  });
};
SCREENS.adminProjet = () => {
  // en ligne, le détail (dont la maquette) n'est chargé qu'à l'ouverture de la fiche
  if (enLigne() && (!S.admFiche || S.admFiche.ref !== S.admRef)) {
    swap(`<div class="screen adm"><p class="hint">Ouverture du projet ${esc(S.admRef)}…</p></div>`, async ()=>{
      try { S.admFiche = await chargerProjet(S.admRef); SCREENS.adminProjet(); }
      catch (err) {
        $('#stage').innerHTML = `<div class="screen adm in"><div class="envoi-ko">${esc(err.message)}</div>
          <div class="actions"><button class="btn" id="ficheRetour">Retour aux projets</button></div></div>`;
        $('#ficheRetour').onclick = ()=>go('admin');
      }
    });
    return;
  }
  const p = enLigne() ? S.admFiche : PROJETS.find(x=>x.ref===S.admRef);
  if(!p || !p.etat) return go('admin');
  const e = p.etat, st = e.site;
  const pagesOn = st.pages.filter(x=>x.on);
  const val = (v)=> v ? esc(v) : '<span class="vide">non renseigné</span>';
  swap(`<div class="screen adm">
    <button class="adm-back" id="admRetour">←&nbsp; Tous les projets</button>
    <div class="adm-top">
      <div><p class="eyebrow">Projet ${esc(p.ref)} · reçu le ${esc(p.date)}</p>
        <h1>${esc(e.name)}</h1>
        <p class="sub">${esc(e.metierLabel)}${e.specialization?' · '+esc(e.specialization):''} — maquette complétée à ${p.pct} %</p></div>
      <span class="pill ${p.statut}" id="admPill">${esc(nomStatut(p.statut))}</span>
    </div>
    <div class="adm-detail">
      <div>
        <div class="adm-card"><h3>Client</h3>
          <dl class="adm-def">
            <dt>Email</dt><dd>${val(p.email)}</dd>
            <dt>Téléphone</dt><dd>${val(p.tel)}</dd>
            <dt>Adresse</dt><dd>${val(st.contact.address)}</dd>
            <dt>Horaires</dt><dd>${val(st.contact.hours)}</dd>
            <dt>Échéance</dt><dd>${val(p.echeance)}</dd>
            <dt>Budget</dt><dd>${val(p.budget)}</dd>
          </dl></div>

        <div class="adm-card"><h3>Le brief, dans ses mots</h3>
          <dl class="adm-def">
            <dt>Objectif</dt><dd>${esc((PACKS[e.packSlug].goals.find(g=>g.id===e.goal)||PACKS[e.packSlug].goals[0]).label)}</dd>
            <dt>Tempérament</dt><dd>${esc(adnTop(e.adn,3).join(', '))}</dd>
          </dl>
          ${e.diff?`<blockquote class="adm-quote">« ${esc(e.diff)} »</blockquote>`:'<p class="sub" style="margin:12px 0 0;font-size:13.5px">Le client n’a pas rempli la phrase de différenciation.</p>'}
        </div>

        <div class="adm-card"><h3>Choix de design</h3>
          <dl class="adm-def">
            <dt>Univers</dt><dd>${esc((THEMES.find(t=>t[0]===e.theme)||['','—'])[1])} · palette ${e.palette+1} · typo ${e.fontPair===0?'A':'B'}</dd>
            <dt>Accueil</dt><dd>${esc(LAY_LABEL[e.layout.hero])}</dd>
            <dt>Offre</dt><dd>${esc(LAY_LABEL[e.layout.services])}</dd>
            <dt>Galerie</dt><dd>${esc(LAY_LABEL[e.layout.gallery]||'—')}</dd>
            <dt>À propos</dt><dd>${esc(LAY_LABEL[e.layout.about]||e.layout.about)}</dd>
          </dl></div>

        <div class="adm-card"><h3>Contenu fourni</h3>
          <dl class="adm-def"><dt>Accroche</dt><dd>${esc(st.heroSub)}</dd>
            <dt>Bouton</dt><dd>${esc(st.cta)}</dd></dl>
          <div style="margin-top:14px">${st.services.map(s=>`<div class="adm-svc"><b>${esc(s.name)}</b><span>${esc(s.desc)}</span></div>`).join('')}</div>
          <div class="adm-svc"><b>À propos</b><span>${esc(st.about)}</span></div>
        </div>

        <div class="adm-card"><h3>Pages demandées <span style="text-transform:none;letter-spacing:0;font-family:var(--f-ui)">${pagesOn.length}</span></h3>
          <div class="adm-tags">${st.pages.map(pg=>`<span class="${pg.on?'on':''}">${esc(pg.label)}${pg.custom?' ★':''}</span>`).join('')}</div>
          <p class="sub" style="margin:11px 0 0;font-size:12.5px">★ = page demandée par le client, hors de nos suggestions.</p>
        </div>

        <div class="adm-card"><h3>Images & réseaux</h3>
          ${st.logo?`<div class="logo-preview" style="margin-bottom:14px"><img src="${st.logo}" alt="Logo du client" class="lg-${st.logoMode||'tel-quel'}"></div>`:''}
          <dl class="adm-def">
            <dt>Logo</dt><dd>${st.logo?'fourni ('+esc({'tel-quel':'tel quel','pastille':'sur pastille claire','inverse':'inversé'}[st.logoMode||'tel-quel'])+')':'<span class="vide">à demander</span>'}</dd>
            <dt>Photos</dt><dd>${(st.heroImg?1:0)+st.gallery.filter(Boolean).length} fournie(s) sur 7</dd>
            <dt>Instagram</dt><dd>${val(st.socials.instagram)}</dd>
            <dt>Facebook</dt><dd>${val(st.socials.facebook)}</dd>
          </dl></div>
      </div>

      <div class="adm-sticky">
        <div class="adm-card"><h3>Avancement</h3>
          <div class="adm-flow" id="admFlow">${STATUTS.map(([k,l])=>
            `<button data-s="${k}" class="${p.statut===k?'on':''}">${l}</button>`).join('')}</div>
          <ul class="adm-hist" id="admHist">${[...p.historique].reverse().map(h=>
            `<li><time>${esc(h.d)}</time><span>${esc(h.q)}</span></li>`).join('')}</ul>
        </div>

        <div class="adm-card"><h3>Échanges avec le client</h3>
          <div id="admFil">${p.messages.length?p.messages.map(m=>
            `<div class="adm-msg ${m.de==='atelier'?'atelier':''}"><span class="qui"><span>${m.de==='atelier'?'Atelier':esc(e.name)}</span><span>${esc(m.d)}</span></span>${esc(m.t)}</div>`).join('')
            :'<p class="sub" style="margin:0 0 12px;font-size:13.5px">Aucun échange pour le moment.</p>'}</div>
          <div class="adm-compose">
            <textarea id="admTexte" placeholder="Demander une information manquante, envoyer un point d'étape…"></textarea>
            <button class="mini-btn" id="admEnvoyer">Envoyer au client</button>
          </div>
        </div>

        <div class="adm-card"><h3>Maquette du client</h3>
          <div class="adm-shot"><div class="scroll">${renderSite({as:{...e, finished:true}})}</div></div>
          <button class="mini-btn" id="admCopier" style="margin-top:12px">Copier le brief complet</button>
        </div>
      </div>
    </div>
  </div>`,
  ()=>{
    $('#admRetour').onclick = ()=>{ S.admProjets=null; go('admin'); };
    $('#admFlow').addEventListener('click', async ev=>{
      const b = ev.target.closest('button'); if(!b || b.classList.contains('on')) return;
      const avant = p.statut;
      b.disabled = true;
      try { await changerStatut(p, b.dataset.s); S.admProjets=null; go('adminProjet'); }
      catch (err) { p.statut = avant; b.disabled = false; alert('Changement impossible : '+err.message); }
    });
    $('#admEnvoyer').onclick = async ()=>{
      const champ = $('#admTexte'), t = champ.value.trim(); if(!t) return;
      const b = $('#admEnvoyer'); b.disabled = true; b.textContent = 'Envoi…';
      try { await envoyerMessage(p, t); go('adminProjet'); }
      catch (err) {
        b.disabled = false; b.textContent = 'Envoyer au client';
        $('#admFil').insertAdjacentHTML('beforeend', `<div class="envoi-ko">${esc(err.message)}</div>`);
      }
    };
    $('#admCopier').onclick = async ()=>{
      const txt = briefTexte(p);
      try{ await navigator.clipboard.writeText(txt); $('#admCopier').textContent='Brief copié ✓'; }
      catch{ $('#admCopier').textContent='Copie refusée par le navigateur'; }
      setTimeout(()=>{ const b=$('#admCopier'); if(b) b.textContent='Copier le brief complet'; }, 2200);
    };
  });
};
// version texte du dossier, à coller dans un devis ou un outil de gestion
function briefTexte(p){
  const e = p.etat, st = e.site;
  const L = [];
  L.push(`PROJET ${p.ref} — ${e.name}`, `Reçu le ${p.date} · statut : ${nomStatut(p.statut)} · maquette ${p.pct} %`, '');
  L.push('CLIENT', `Email : ${p.email||'—'}`, `Téléphone : ${p.tel||'—'}`, `Adresse : ${st.contact.address||'—'}`,
    `Horaires : ${st.contact.hours||'—'}`, `Échéance : ${p.echeance} · Budget : ${p.budget}`, '');
  L.push('ACTIVITÉ', `${e.metierLabel}${e.specialization?' · '+e.specialization:''}`,
    `Objectif : ${(PACKS[e.packSlug].goals.find(g=>g.id===e.goal)||PACKS[e.packSlug].goals[0]).label}`,
    `Tempérament détecté : ${adnTop(e.adn,3).join(', ')}`, e.diff?`Ses mots : « ${e.diff} »`:'Phrase de différenciation : non remplie', '');
  L.push('DESIGN', `Univers : ${(THEMES.find(t=>t[0]===e.theme)||['','—'])[1]} · palette ${e.palette+1} · typo ${e.fontPair===0?'A':'B'}`,
    `Accueil : ${LAY_LABEL[e.layout.hero]}`, `Offre : ${LAY_LABEL[e.layout.services]}`,
    `Galerie : ${LAY_LABEL[e.layout.gallery]||'—'}`, `À propos : ${LAY_LABEL[e.layout.about]||e.layout.about}`, '');
  L.push('CONTENU', `Accroche : ${st.heroSub}`, `Bouton : ${st.cta}`, '');
  st.services.forEach(s=>L.push(`- ${s.name} : ${s.desc}`));
  L.push('', `À propos : ${st.about}`, '');
  L.push('PAGES', st.pages.filter(x=>x.on).map(x=>'- '+x.label+(x.custom?' (demande du client)':'')).join('\n'), '');
  L.push('IMAGES & RÉSEAUX', `Logo : ${st.logo?'fourni':'à demander'}`,
    `Photos : ${(st.heroImg?1:0)+st.gallery.filter(Boolean).length} sur 7`,
    `Instagram : ${st.socials.instagram||'—'} · Facebook : ${st.socials.facebook||'—'}`);
  return L.join('\n');
}

/* ================= DÉMARRAGE ================= */
$('#home').onclick = ()=>{ if($('#viewer').classList.contains('on')) closeWork();
  S.closeDrawer && S.closeDrawer(); $('#recapOverlay').classList.remove('on'); go('landing'); };
const ouvrirAtelier = ()=>{ if($('#viewer').classList.contains('on')) closeWork();
  S.closeDrawer && S.closeDrawer(); $('#recapOverlay').classList.remove('on');
  S.admFiltre='tous'; S.admProjets=null; S.admFiche=null;
  if (enLigne()) SB.restaurer();
  go(enLigne() && !SB.session ? 'connexion' : 'admin'); };
$('#admEntree').onclick = ouvrirAtelier;
addEventListener('keydown', e=>{ if(e.ctrlKey && e.shiftKey && (e.key==='A'||e.key==='a')){ e.preventDefault(); ouvrirAtelier(); } });
go('landing');
</script>
