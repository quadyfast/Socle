<title>Socle — Prototype du parcours de création</title>
<style>
/* ============ PLATEFORME — tokens ============ */
:root{
  --paper:#F5F6F3; --card:#FFFFFF; --ink:#171B26; --muted:#6A7183;
  --line:#E1E3E0; --line-strong:#C9CCD4;
  --accent:#2B44D8; --accent-ink:#1D2F9E; --accent-soft:#EDEFFC;
  --ok:#1E7A4B; --warn:#B4690E; --night:#10142B; --night-ink:#E8EAF6;
  --f-display:Georgia,'Iowan Old Style','Times New Roman',serif;
  --f-ui:system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:ui-monospace,'Cascadia Code',Consolas,'Courier New',monospace;
  --dur:1; --r:6px;
  --shadow:0 1px 2px rgba(23,27,38,.05),0 8px 28px rgba(23,27,38,.08);
}
@media (prefers-reduced-motion: reduce){ :root{--dur:0} }
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font-family:var(--f-ui);cursor:pointer}
input,textarea,select{font-family:var(--f-ui);color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}

/* ============ chrome ============ */
.topbar{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;
  padding:14px 22px;pointer-events:none;background:linear-gradient(to bottom,var(--paper) 55%,transparent)}
.wordmark{font-family:var(--f-mono);font-size:13px;letter-spacing:.18em;color:var(--ink);pointer-events:auto;
  background:none;border:none;padding:0;transition:opacity calc(.15s*var(--dur))}
.wordmark:hover{opacity:.62}
.wordmark b{color:var(--accent)}
.wordmark small{color:var(--muted);letter-spacing:.08em;margin-left:10px;font-weight:400}
.progress{position:fixed;top:0;left:0;height:3px;background:var(--accent);width:0%;z-index:60;
  transition:width calc(.6s*var(--dur)) cubic-bezier(.22,1,.36,1)}
.saved{position:fixed;bottom:18px;left:22px;z-index:70;font-family:var(--f-mono);font-size:12px;color:var(--ok);
  opacity:0;transition:opacity calc(.3s*var(--dur));pointer-events:none}
.saved.on{opacity:1}

/* ============ écrans du tunnel ============ */
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:90px 22px 60px}
.screen{width:100%;max-width:660px;opacity:0;transform:translateY(14px);
  transition:opacity calc(.28s*var(--dur)) ease,transform calc(.28s*var(--dur)) cubic-bezier(.22,1,.36,1)}
.screen.in{opacity:1;transform:none}
.screen.out{opacity:0;transform:translateY(-14px)}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin:0 0 14px}
.q{font-family:var(--f-display);font-size:clamp(26px,4.6vw,40px);line-height:1.18;margin:0 0 10px;text-wrap:balance;font-weight:400}
.hint{color:var(--muted);margin:0 0 30px;max-width:52ch}
.bigfield{width:100%;font-size:clamp(19px,2.6vw,24px);padding:16px 4px;border:none;border-bottom:2px solid var(--line-strong);
  background:transparent;transition:border-color calc(.2s*var(--dur))}
.bigfield:focus{border-color:var(--accent);outline:none}
textarea.bigfield{resize:none;line-height:1.5;border:1.5px solid var(--line-strong);border-radius:var(--r);padding:16px;font-size:17px}
textarea.bigfield:focus{border-color:var(--accent)}
.actions{display:flex;align-items:center;gap:16px;margin-top:34px;flex-wrap:wrap}
.btn{border:none;border-radius:var(--r);padding:14px 26px;font-size:16px;font-weight:600;background:var(--accent);color:#fff;
  transition:transform calc(.15s*var(--dur)),background calc(.15s*var(--dur));display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:var(--accent-ink)}
.btn:active{transform:scale(.98)}
.btn[disabled]{background:var(--line-strong);cursor:not-allowed}
.btn-ghost{background:transparent;border:none;color:var(--muted);font-size:15px;padding:14px 6px;text-decoration:underline;text-underline-offset:3px}
.btn-ghost:hover{color:var(--ink)}
.kb{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.kb b{border:1px solid var(--line-strong);border-radius:4px;padding:1px 6px;font-weight:400;background:var(--card)}

/* landing */
.landing{max-width:760px;text-align:left}
.landing .q{font-size:clamp(34px,6vw,58px);margin-bottom:18px}
.chips{display:flex;gap:10px;margin:26px 0 0;flex-wrap:wrap}
.chip{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;color:var(--muted);border:1px solid var(--line);
  border-radius:99px;padding:6px 14px;background:var(--card)}
.land-demo{margin-top:44px;border:1px solid var(--line);border-radius:10px;background:var(--card);box-shadow:var(--shadow);
  padding:18px 20px;display:flex;gap:18px;align-items:center}
.land-demo .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none;animation:pulse 2.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.land-demo p{margin:0;color:var(--muted);font-size:14.5px}
/* reprise d'un travail en cours */
.reprise{margin-top:18px;border:1.5px solid var(--accent);background:var(--accent-soft);border-radius:10px;
  padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
.reprise-txt b{display:block;font-size:15.5px}
.reprise-txt span{color:var(--muted);font-size:13.5px}
.reprise-btn{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.reprise-btn .btn{padding:11px 22px;font-size:15px}

/* autocomplétion */
.ac{position:relative}
.ac-list{position:absolute;top:100%;left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:0 0 var(--r) var(--r);
  box-shadow:var(--shadow);z-index:10;max-height:280px;overflow:auto}
.ac-item{padding:13px 16px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ac-item:hover,.ac-item.sel{background:var(--accent-soft)}
.ac-item small{color:var(--muted);font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase}

/* cartes d'options (objectif, spécialisation) */
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-top:6px}
.opt{border:1.5px solid var(--line);border-radius:var(--r);background:var(--card);padding:18px 16px;text-align:left;
  font-size:15.5px;font-weight:600;color:var(--ink);transition:border-color calc(.15s*var(--dur)),transform calc(.15s*var(--dur)),box-shadow calc(.15s*var(--dur))}
.opt small{display:block;font-weight:400;color:var(--muted);margin-top:5px;font-size:13.5px;line-height:1.4}
.opt:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt .glyph{font-family:var(--f-mono);color:var(--accent);font-size:13px;display:block;margin-bottom:8px}

/* carte de visite (écran nom) */
.bizcard{margin-top:38px;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);
  padding:34px 30px;max-width:420px;transition:opacity calc(.3s*var(--dur))}
.bizcard .bc-name{font-family:var(--f-display);font-size:26px;letter-spacing:.01em;min-height:34px}
.bizcard .bc-line{width:34px;height:2px;background:var(--accent);margin:12px 0}
.bizcard .bc-sub{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* univers — 4 mini-aperçus */
.univers{max-width:1040px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-top:8px}
.thumb{border:2px solid var(--line);border-radius:10px;background:var(--card);overflow:hidden;padding:0;text-align:left;
  transition:border-color calc(.2s*var(--dur)),transform calc(.2s*var(--dur)),box-shadow calc(.2s*var(--dur))}
.thumb:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--line-strong)}
.thumb.sel{border-color:var(--accent)}
.thumb .t-cap{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line)}
.thumb .t-cap b{flex:none}
.thumb{position:relative}
.reco{position:absolute;top:10px;left:10px;z-index:3;font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;background:var(--accent);color:#fff;padding:4px 10px;border-radius:99px}
.adn-line{font-size:14.5px;color:var(--muted);margin:-16px 0 24px;border-left:2px solid var(--accent);padding-left:13px}
.adn-line b{color:var(--ink);font-weight:600}
.thumb .t-cap span{text-align:right}
.thumb .t-cap b{font-size:14.5px}
.thumb .t-cap span{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.08em}
.thumb.sel .t-cap span{color:var(--accent)}
.mini{height:290px;overflow:hidden;position:relative;background:#eee}
.mini-inner{width:1000px;transform:scale(.245);transform-origin:0 0;position:absolute;top:0;left:50%;margin-left:-122.5px;pointer-events:none;
  transition:transform 2.4s ease}
.thumb:hover .mini-inner{transform:scale(.245) translateY(-620px)}
.mini .s-badge{display:none}

/* ============ ESPACE ATELIER (administration) ============ */
.adm{max-width:1240px;width:100%}
.adm-top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:22px}
.adm-top h1{font-family:var(--f-display);font-weight:400;font-size:clamp(24px,3.4vw,34px);margin:0}
.adm-top .sub{color:var(--muted);margin:4px 0 0;font-size:14.5px}
.adm-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px;margin-bottom:20px}
.adm-stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:13px 15px}
.adm-stat b{display:block;font-family:var(--f-mono);font-size:24px;font-variant-numeric:tabular-nums;line-height:1.1}
.adm-stat span{font-size:12px;color:var(--muted);letter-spacing:.02em}
.adm-stat.actif{border-color:var(--accent);background:var(--accent-soft)}
.adm-table{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.adm-row{display:grid;grid-template-columns:88px 1.6fr 1.3fr 96px 132px 108px;gap:14px;align-items:center;
  padding:14px 18px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:none;border-right:none;border-top:none;
  text-align:left;transition:background calc(.14s*var(--dur))}
.adm-row:last-child{border-bottom:none}
.adm-row:hover{background:var(--paper)}
.adm-row.entete{background:var(--paper);font-family:var(--f-mono);font-size:10.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--muted);cursor:default;padding:10px 18px}
.adm-row .ref{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.adm-row .nom{font-weight:600;font-size:15px}
.adm-row .nom small{display:block;font-weight:400;color:var(--muted);font-size:12.5px;margin-top:1px}
.adm-row .meta{font-size:13.5px;color:var(--muted)}
.adm-row .pct{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;text-align:right}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:99px;padding:4px 11px;white-space:nowrap}
.pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.nouveau{background:#EDEFFC;color:#1D2F9E}
.pill.etude{background:#FFF2DC;color:#8A5209}
.pill.creation{background:#E7F3FF;color:#0B5A9E}
.pill.validation{background:#F3E9FF;color:#5B2E9E}
.pill.termine{background:#E4F6EC;color:#166B41}
@media (prefers-color-scheme:dark){
  .pill.nouveau{background:#1D2450;color:#AFBBFF}.pill.etude{background:#3A2B10;color:#F0C078}
  .pill.creation{background:#0F2A42;color:#93C7F5}.pill.validation{background:#2C1B45;color:#CBA9F5}
  .pill.termine{background:#123024;color:#8FD9B0}
}
.adm-back{background:none;border:none;color:var(--muted);font-size:14px;padding:0 0 14px;display:inline-flex;gap:7px;align-items:center}
.adm-back:hover{color:var(--ink)}
.adm-detail{display:grid;grid-template-columns:1.05fr .95fr;gap:22px;align-items:start}
.adm-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:16px}
.adm-card h3{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  margin:0 0 13px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.adm-def{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;font-size:14px;align-items:baseline}
.adm-def dt{color:var(--muted);font-size:12.5px;white-space:nowrap}
.adm-def dd{margin:0;line-height:1.5}
.adm-def dd.vide{color:var(--muted);font-style:italic}
.adm-quote{border-left:2px solid var(--accent);padding:2px 0 2px 13px;margin:12px 0 0;font-size:14.5px;line-height:1.5}
.adm-tags{display:flex;gap:6px;flex-wrap:wrap}
.adm-tags span{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:3px 10px;color:var(--muted)}
.adm-tags span.on{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
.adm-svc{border-top:1px solid var(--line);padding:10px 0;font-size:14px}
.adm-svc:first-of-type{border-top:none}
.adm-svc b{display:block;font-size:14px}
.adm-svc span{color:var(--muted);font-size:13px;line-height:1.5}
.adm-flow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.adm-flow button{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:6px 13px;font-size:12.5px;color:var(--muted)}
.adm-flow button:hover{border-color:var(--line-strong);color:var(--ink)}
.adm-flow button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.adm-hist{list-style:none;margin:0;padding:0;font-size:13.5px}
.adm-hist li{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:8px 0;border-top:1px dotted var(--line);align-items:baseline}
.adm-hist li:first-child{border-top:none}
.adm-hist time{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
.adm-msg{border:1px solid var(--line);border-radius:8px;padding:11px 13px;margin-bottom:9px;font-size:14px;line-height:1.5}
.adm-msg.atelier{background:var(--accent-soft);border-color:transparent}
.adm-msg .qui{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  display:flex;justify-content:space-between;gap:10px;margin-bottom:5px}
.adm-compose{display:flex;flex-direction:column;gap:8px}
.adm-compose textarea{border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px;resize:vertical;min-height:70px;background:var(--card)}
.adm-compose textarea:focus{border-color:var(--accent);outline:none}
.adm-sticky{position:sticky;top:70px}
.adm-shot{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.adm-shot .scroll{max-height:60vh;overflow-y:auto}
.adm-vide{text-align:center;padding:50px 20px;color:var(--muted)}
.adm-vide b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px;font-weight:600}
.adm-entree{pointer-events:auto;background:none;border:1px solid var(--line);border-radius:99px;padding:5px 12px;
  font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.adm-entree:hover{border-color:var(--accent);color:var(--accent)}
@media (max-width:980px){
  .adm-detail{grid-template-columns:1fr}
  .adm-sticky{position:relative;top:0}
  .adm-row{grid-template-columns:70px 1.4fr 108px;gap:10px}
  .adm-row .meta,.adm-row .pct,.adm-row .date{display:none}
}

/* ============ ATELIER GUIDÉ ============ */
.atelier-wrap{max-width:1080px;width:100%}
.props{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:6px}
.props-txt{grid-template-columns:1fr;max-width:720px}
.prop{border:1.5px solid var(--line);border-radius:10px;background:var(--card);padding:0;text-align:left;
  display:flex;flex-direction:column;overflow:hidden;
  transition:border-color calc(.18s*var(--dur)),transform calc(.18s*var(--dur)),box-shadow calc(.18s*var(--dur))}
.prop:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:var(--shadow)}
.prop.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.prop-lab{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--accent);
  padding:13px 16px 0}
.prop-txt{padding:5px 16px 15px;font-size:15px;line-height:1.5;color:var(--ink)}
.props-txt .prop-txt{font-size:16.5px;font-family:var(--f-display)}
.prop-shot{display:block;height:186px;overflow:hidden;position:relative;border-bottom:1px solid var(--line);background:var(--paper)}
.prop-inner{display:block;width:1180px;transform:scale(.23);transform-origin:0 0;position:absolute;top:0;left:0;pointer-events:none}
.prop-shot .s-badge{display:none}
.prop.sel .prop-lab::after{content:' ✓'}

/* ============ RÉALISATIONS ============ */
.works-wrap{max-width:1140px;width:100%}
.works-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:22px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}
.filt{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:8px 16px;font-size:13.5px;
  color:var(--muted);transition:border-color calc(.15s*var(--dur)),color calc(.15s*var(--dur))}
.filt:hover{border-color:var(--line-strong);color:var(--ink)}
.filt.sel{background:var(--ink);border-color:var(--ink);color:#fff}
.works{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:22px}
.work{border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden;padding:0;text-align:left;
  box-shadow:0 1px 2px rgba(23,27,38,.04);transition:transform calc(.25s*var(--dur)) cubic-bezier(.22,1,.36,1),box-shadow calc(.25s*var(--dur))}
.work:hover{transform:translateY(-5px);box-shadow:0 14px 40px rgba(23,27,38,.13)}
.work-shot{height:238px;overflow:hidden;position:relative;border-bottom:1px solid var(--line);background:var(--paper)}
.work-shot .mini-inner{width:1180px;transform:scale(.30);transform-origin:0 0;position:absolute;top:0;left:0;pointer-events:none;
  transition:transform 3s cubic-bezier(.4,0,.2,1)}
.work:hover .work-shot .mini-inner{transform:scale(.30) translateY(-1180px)}
.work-shot .s-badge{display:none}
.work-shot::after{content:'Voir le site';position:absolute;inset:auto 0 0 0;padding:26px 16px 14px;font-size:13px;font-weight:600;color:#fff;
  background:linear-gradient(to top,rgba(16,20,43,.86),transparent);opacity:0;transition:opacity calc(.2s*var(--dur))}
.work:hover .work-shot::after{opacity:1}
.work-body{padding:16px 18px 18px}
.work-body .top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.work-body b{font-family:var(--f-display);font-size:18px;font-weight:400}
.work-body .yr{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);flex:none}
.work-body .sect{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:5px 0 8px}
.work-body p{margin:0 0 12px;font-size:14px;color:var(--muted);line-height:1.5}
.work-meta{display:flex;gap:6px;flex-wrap:wrap}
.work-meta span{font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:3px 10px}
.demo-note{font-size:12.5px;color:var(--muted);border-left:2px solid var(--line-strong);padding:6px 0 6px 12px;margin:0 0 24px;max-width:60ch}
.works-cta{margin-top:40px;padding:32px;border-radius:12px;background:var(--night);color:var(--night-ink);
  display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}
.works-cta h3{font-family:var(--f-display);font-weight:400;font-size:23px;margin:0 0 6px}
.works-cta p{margin:0;color:rgba(232,234,246,.72);font-size:14.5px}
.works-cta .btn{background:var(--card);color:var(--ink)}
.works-cta .btn:hover{background:#fff}

/* aperçu plein écran d'une réalisation */
.viewer{position:fixed;inset:0;z-index:130;background:var(--paper);display:flex;flex-direction:column;
  opacity:0;pointer-events:none;transition:opacity calc(.28s*var(--dur))}
.viewer.on{opacity:1;pointer-events:auto}
.viewer-bar{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--card);flex-wrap:wrap}
.viewer-bar .vname{font-family:var(--f-display);font-size:17px}
.viewer-bar .vsect{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.viewer-body{flex:1;overflow:hidden;padding:18px;display:flex;justify-content:center}
.viewer-frame{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;width:100%;max-width:1180px;
  transition:max-width calc(.4s*var(--dur)) cubic-bezier(.22,1,.36,1)}
.viewer-frame.tablet{max-width:768px}.viewer-frame.mobile{max-width:390px}
.viewer-scroll{height:100%;overflow-y:auto}

/* bandeau de réalisations sur l'écran de confirmation */
.teaser{margin:34px 0 0;text-align:left}
.teaser-h{display:flex;justify-content:space-between;align-items:baseline;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.teaser-h b{font-family:var(--f-display);font-size:18px;font-weight:400}
.teaser-h button{border:none;background:none;color:var(--accent);font-size:14px;text-decoration:underline;text-underline-offset:3px;padding:0}
.teaser-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tcard{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card);padding:0;text-align:left;
  transition:transform calc(.2s*var(--dur)),box-shadow calc(.2s*var(--dur))}
.tcard:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.tcard .shot{height:120px;overflow:hidden;position:relative;border-bottom:1px solid var(--line)}
.tcard .mini-inner{width:1180px;transform:scale(.19);transform-origin:0 0;position:absolute;top:0;left:0;pointer-events:none}
.tcard .shot .s-badge{display:none}
.tcard .cap{padding:9px 12px;font-size:13.5px;font-weight:600}
.tcard .cap small{display:block;font-weight:400;color:var(--muted);font-size:11.5px;margin-top:1px}
@media (max-width:720px){ .teaser-row{grid-template-columns:1fr} }

/* ============ RÉVÉLATION ============ */
.reveal-veil{position:fixed;inset:0;background:var(--night);z-index:100;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:30px;color:var(--night-ink);opacity:0;transition:opacity calc(.5s*var(--dur));pointer-events:none}
.reveal-veil.on{opacity:1;pointer-events:auto}
.ring{width:74px;height:74px}
.ring circle{fill:none;stroke-width:3}
.ring .bg{stroke:rgba(232,234,246,.14)}
.ring .fg{stroke:var(--accent);stroke-linecap:round;stroke-dasharray:213;stroke-dashoffset:213;
  transition:stroke-dashoffset .7s ease;transform:rotate(-90deg);transform-origin:center}
.reveal-status{font-family:var(--f-mono);font-size:13.5px;letter-spacing:.1em;min-height:20px;opacity:.9}
.reveal-status::after{content:'▌';animation:blink 1s steps(1) infinite;margin-left:2px;color:var(--accent)}
@keyframes blink{50%{opacity:0}}

/* ============ STUDIO ============ */
.studio{display:grid;grid-template-columns:390px 1fr;min-height:100vh;padding-top:54px}
.panel{border-right:1px solid var(--line);background:var(--card);padding:22px;overflow-y:auto;max-height:calc(100vh - 54px);position:sticky;top:54px}
.panel-head{margin-bottom:18px}
.panel-head .pct-row{display:flex;justify-content:space-between;align-items:baseline}
.panel-head h2{font-family:var(--f-display);font-size:21px;margin:0;font-weight:400}
.pct{font-family:var(--f-mono);font-size:22px;color:var(--accent);font-variant-numeric:tabular-nums}
.pct small{font-size:12px;color:var(--muted)}
.pbar{height:5px;background:var(--paper);border-radius:99px;margin-top:10px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:99px;width:0;
  transition:width calc(.8s*var(--dur)) cubic-bezier(.22,1,.36,1)}
.msgbox{min-height:44px;margin:14px 0 6px}
.msg{font-size:14px;color:var(--ink);background:var(--accent-soft);border-left:3px solid var(--accent);
  padding:10px 13px;border-radius:0 var(--r) var(--r) 0;opacity:0;transform:translateY(6px);
  transition:opacity calc(.3s*var(--dur)),transform calc(.3s*var(--dur))}
.msg.on{opacity:1;transform:none}
.chantiers{display:flex;flex-direction:column;gap:9px;margin-top:8px}
.chantier{display:flex;align-items:center;gap:13px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--card);
  padding:13px 14px;text-align:left;width:100%;transition:border-color calc(.15s*var(--dur)),transform calc(.15s*var(--dur))}
.chantier:hover{border-color:var(--accent);transform:translateX(2px)}
.chantier .st{font-family:var(--f-mono);font-size:15px;width:22px;text-align:center;flex:none}
.chantier .st.done{color:var(--ok)}.chantier .st.part{color:var(--warn)}.chantier .st.todo{color:var(--line-strong)}
.chantier b{font-size:14.5px;display:block}
.chantier small{color:var(--muted);font-size:12.5px;display:block;margin-top:1px}
.chantier .cpct{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.finish{margin-top:20px;width:100%;justify-content:center}
.finish-note{font-size:12.5px;color:var(--muted);text-align:center;margin-top:8px}

/* éditeurs du panneau */
.ed-back{background:none;border:none;color:var(--muted);font-size:14px;padding:0 0 14px;display:flex;gap:6px;align-items:center}
.ed-back:hover{color:var(--ink)}
.ed h3{font-family:var(--f-display);font-weight:400;font-size:19px;margin:0 0 4px}
.ed .ed-hint{color:var(--muted);font-size:13.5px;margin:0 0 16px}
.field{margin-bottom:14px}
.field label{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;border:1.5px solid var(--line);border-radius:var(--r);padding:10px 12px;font-size:14.5px;background:var(--card)}
.field input:focus,.field textarea:focus{border-color:var(--accent);outline:none}
.field textarea{resize:vertical;min-height:80px;line-height:1.5}
.svc-row{border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px;background:var(--paper)}
.svc-row input{width:100%;border:none;background:transparent;font-weight:600;font-size:14.5px;padding:2px 0}
.svc-row textarea{width:100%;border:none;background:transparent;font-size:13.5px;color:var(--muted);resize:none;padding:2px 0;line-height:1.45}
.svc-row input:focus,.svc-row textarea:focus{outline:none}
.mini-btn{border:1px solid var(--line-strong);background:var(--card);border-radius:var(--r);padding:7px 13px;font-size:13px;font-weight:600;color:var(--ink)}
.mini-btn:hover{border-color:var(--accent);color:var(--accent)}
.mini-btn.ai{color:var(--accent);border-color:var(--accent-soft);background:var(--accent-soft)}
.swatches{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);padding:0;transition:transform calc(.15s*var(--dur))}
.sw:hover{transform:scale(1.12)}
.sw.sel{border-color:var(--ink);box-shadow:0 0 0 2px var(--card) inset}
.theme-chips{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.compo{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--paper)}
.compo p{margin:0 0 11px;font-size:13px;color:var(--muted);line-height:1.5}
.compo-adn{padding-bottom:10px;border-bottom:1px solid var(--line)}
.compo-adn b{color:var(--ink)}
.compo-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.compo-n{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.compo-n small{opacity:.65}
.tchip{border:1.5px solid var(--line);border-radius:var(--r);background:var(--card);padding:10px;font-size:13.5px;font-weight:600}
.tchip.sel{border-color:var(--accent);background:var(--accent-soft)}
.seg{display:flex;border:1.5px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:14px}
.seg button{flex:1;border:none;background:var(--card);padding:9px;font-size:13px;color:var(--muted)}
.seg button.sel{background:var(--ink);color:#fff}
.page-row{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.page-row input[type=checkbox]{width:17px;height:17px;margin-top:2px;accent-color:var(--accent)}
.page-row b{font-size:14.5px}
.page-row small{display:block;color:var(--muted);font-size:12.5px;line-height:1.4}
.up-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.up-cell{border:1px dashed var(--line-strong);border-radius:var(--r);aspect-ratio:4/3;position:relative;overflow:hidden;
  background-size:cover;background-position:center;display:flex;align-items:flex-end}
.up-cell button{margin:7px;border:none;background:rgba(23,27,38,.75);color:#fff;font-size:11.5px;border-radius:4px;padding:5px 9px}
/* zone de dépôt du logo + aperçu, sur damier pour révéler la transparence */
.logo-zone{border:1.5px dashed var(--line-strong);border-radius:var(--r);padding:20px 16px;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:10px;transition:border-color calc(.15s*var(--dur))}
.logo-zone:hover{border-color:var(--accent)}
.logo-zone button{border:none;background:var(--accent);color:#fff;border-radius:var(--r);padding:9px 18px;font-size:14px;font-weight:600}
.logo-zone span{font-size:12px;color:var(--muted)}
.logo-preview{border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:10px;
  display:flex;align-items:center;justify-content:center;min-height:86px;
  background-color:#fff;
  background-image:linear-gradient(45deg,#eceef1 25%,transparent 25%),linear-gradient(-45deg,#eceef1 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#eceef1 75%),linear-gradient(-45deg,transparent 75%,#eceef1 75%);
  background-size:14px 14px;background-position:0 0,0 7px,7px -7px,-7px 0}
.logo-preview.sombre{background-color:#25272E;
  background-image:linear-gradient(45deg,#2E313A 25%,transparent 25%),linear-gradient(-45deg,#2E313A 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#2E313A 75%),linear-gradient(-45deg,transparent 75%,#2E313A 75%)}
.logo-preview img{max-height:56px;max-width:100%;object-fit:contain}
.logo-preview img.lg-pastille{background:#fff;padding:6px 10px;border-radius:6px}
.logo-preview img.lg-inverse{filter:invert(1) brightness(1.7) contrast(1.05)}

/* prévisualisation */
.preview{padding:18px 26px 40px;min-width:0}
.toolbar{display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.devices{display:flex;border:1.5px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--card)}
.devices button{border:none;background:transparent;padding:8px 14px;font-size:13px;color:var(--muted);display:flex;gap:7px;align-items:center}
.devices button.sel{background:var(--ink);color:#fff}
.toolbar .tag{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.1em;color:var(--muted)}
/* rappel permanent du statut : ce n'est pas le site final */
.tag-brouillon{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  background:rgba(180,105,14,.13);color:var(--warn);border-radius:99px;padding:5px 12px;white-space:nowrap}
.statut-note{font-size:12.5px;color:var(--muted);margin:10px 2px 0;line-height:1.5}
.statut-note b{color:var(--ink);font-weight:600}
/* état verrouillé : la maquette part à l'atelier, elle n'est plus consultable */
.lock-wrap{position:relative}
.lock-wrap .site-scroll{filter:blur(7px) saturate(.55);pointer-events:none;user-select:none}
.lock-veil{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;text-align:center;padding:30px;background:color-mix(in srgb,var(--paper) 74%,transparent);border-radius:8px}
.lock-veil .ico{width:52px;height:52px;border-radius:50%;background:var(--ink);color:#fff;display:flex;
  align-items:center;justify-content:center;font-size:22px}
.lock-veil h3{font-family:var(--f-display);font-weight:400;font-size:21px;margin:0}
.lock-veil p{margin:0;color:var(--muted);font-size:14px;max-width:44ch;line-height:1.55}
.frame-wrap{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:14px;overflow:hidden}
.frame-bar{display:flex;gap:6px;padding:0 4px 12px}
.frame-bar i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.frame-holder{display:flex;justify-content:center;overflow:hidden}
.frame{transition:width calc(.4s*var(--dur)) cubic-bezier(.22,1,.36,1);width:100%;transform-origin:top center}
.frame .site-scroll{max-height:calc(100vh - 210px);overflow-y:auto;border:1px solid var(--line);border-radius:6px;scroll-behavior:smooth}

/* ============ LE SITE RENDU (thèmes de maquette) ============ */
.site{container-type:inline-size;background:var(--s-bg);color:var(--s-ink);font-family:var(--s-body);line-height:1.65;font-size:15.5px;
  --ph-noise:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/><feComponentTransfer><feFuncA type='linear' slope='0.06'/></feComponentTransfer></filter><rect width='140' height='140' filter='url(%23n)'/></svg>")}
.site,.site .s-head,.site .s-card,.site .s-cta,.site .s-quote,.site .s-foot,.site .s-form input,.site .s-form textarea,.site .s-menu{
  transition:background-color .45s ease,color .45s ease,border-color .45s ease}
.site [contenteditable]:hover{outline:1.5px dashed var(--s-accent);outline-offset:3px;cursor:text}
.site [contenteditable]:focus{outline:2px solid var(--s-accent);outline-offset:3px}
/* visible par défaut ; .pre masque les sections encore hors de vue (ajouté par JS) */
.s-sec{padding:64px 7%;position:relative;opacity:1;transform:none;
  transition:opacity .6s ease,transform .6s cubic-bezier(.22,1,.36,1),background-color .45s ease}
.s-sec.pre{opacity:0;transform:translateY(26px)}
@media (prefers-reduced-motion: reduce){.s-sec.pre{opacity:1;transform:none}}
.s-sec.hl{animation:hl 1.6s ease}
@keyframes hl{0%,60%{box-shadow:inset 0 0 0 3px var(--accent)}100%{box-shadow:none}}
.s-badge{position:absolute;top:14px;right:16px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;
  background:rgba(180,105,14,.12);color:#B4690E;border-radius:4px;padding:3px 8px;z-index:3}
.s-head{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:16px 7%;position:sticky;top:0;z-index:6;
  background:color-mix(in srgb,var(--s-bg) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--s-line)}
.s-logo{font-family:var(--s-display);font-size:19px;letter-spacing:.02em;display:flex;align-items:center;gap:10px;font-weight:var(--s-hw2)}
/* le logo garde ses proportions et ne peut jamais écraser l'en-tête,
   quelle que soit sa forme (carré, très large, très haut) */
.s-logo img{height:34px;width:auto;max-width:180px;object-fit:contain;flex:none;display:block}
.s-logo img.lg-pastille{background:#fff;padding:5px 9px;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.14)}
.s-logo img.lg-inverse{filter:invert(1) brightness(1.7) contrast(1.05)}
.s-fbrand img{height:26px;width:auto;max-width:150px;object-fit:contain;display:block;margin-bottom:8px}
.s-fbrand img.lg-pastille{background:#fff;padding:4px 7px;border-radius:5px}
.s-fbrand img.lg-inverse{filter:invert(1) brightness(1.7)}
@container (max-width:640px){ .s-logo img{height:28px;max-width:120px} }
.s-nav{display:flex;gap:22px;font-size:13px;align-items:center;min-width:0;flex-wrap:wrap;justify-content:flex-end}
.s-nav span{color:var(--s-muted)}
.s-nav span:first-child{color:var(--s-ink)}
.s-navcta{font-size:12.5px;font-weight:600;color:var(--s-cta-ink);background:var(--s-accent);padding:8px 16px;border-radius:var(--s-rb);white-space:nowrap}
/* — hero — */
.s-hero{display:grid;grid-template-columns:1.05fr .95fr;gap:54px;align-items:center}
.s-hero h1{font-family:var(--s-display);font-size:clamp(30px,5cqw,50px);line-height:1.08;margin:0 0 18px;
  font-weight:var(--s-hw);text-wrap:balance;letter-spacing:var(--s-hls,-.015em)}
.s-hero .lead{color:var(--s-muted);margin:0 0 28px;max-width:48ch;font-size:16.5px}
.s-ctarow{display:flex;gap:18px;align-items:center;flex-wrap:wrap;max-width:100%}
.s-cta{display:inline-block;background:var(--s-accent);color:var(--s-cta-ink);border-radius:var(--s-rb);padding:14px 28px;
  font-weight:600;font-size:15px;font-family:var(--f-ui);box-shadow:0 8px 24px color-mix(in srgb,var(--s-accent) 28%,transparent);
  transition:transform .2s ease,box-shadow .2s ease,background-color .45s ease,color .45s ease}
.s-cta:hover{transform:translateY(-2px)}
.s-cta2{font-weight:600;font-size:14px;color:var(--s-ink);border-bottom:1.5px solid var(--s-accent);padding-bottom:3px}
.s-trust{display:flex;gap:22px;margin-top:32px;padding-top:20px;border-top:1px solid var(--s-line);flex-wrap:wrap}
.s-trust span{font-size:12.5px;color:var(--s-muted);display:flex;gap:7px;align-items:center;letter-spacing:.01em}
.s-trust em{font-style:normal;color:var(--s-accent);font-size:12px}
.imgwrap{position:relative}
.imgwrap .ph{position:relative;z-index:1}
.s-hero .imgwrap .ph{aspect-ratio:4/3.2}
/* — repères de section — */
.s-kicker{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--s-accent);
  margin:0 0 12px;display:flex;align-items:center;gap:10px}
.s-kicker::before{content:'';width:26px;height:1px;background:var(--s-accent)}
.s-shead{margin-bottom:36px;max-width:62ch}
.s-h2{font-family:var(--s-display);font-size:clamp(22px,3.4cqw,32px);margin:0;line-height:1.15;font-weight:var(--s-hw);letter-spacing:var(--s-hls,-.01em)}
/* — visuels — */
/* la photo est la couche du dessus ; si elle ne charge pas, les couches abstraites
   restent visibles dessous — aucune image cassée, jamais */
.ph{--ph-photo:none;background-color:var(--ph-a);
  background-image:var(--ph-photo),var(--ph-noise),radial-gradient(120% 90% at 25% 12%,rgba(255,255,255,.16),transparent 55%),var(--ph-img);
  background-size:cover,140px 140px,cover,cover;background-position:center;border-radius:var(--s-r);position:relative;overflow:hidden}
.ph.real{background-size:cover}
.ph::after{content:attr(data-cap);position:absolute;bottom:10px;left:10px;font-family:var(--f-mono);font-size:9px;
  letter-spacing:.12em;color:rgba(255,255,255,.9);text-transform:uppercase;background:rgba(0,0,0,.34);padding:3px 9px;border-radius:3px}
.ph.real::after{content:none}
/* — services — */
.s-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.s-card{background:var(--s-card);border:1px solid var(--s-line);border-radius:var(--s-r);padding:26px;
  transition:transform .3s ease,box-shadow .3s ease,background-color .45s ease,border-color .45s ease}
.s-card:hover{transform:translateY(-4px);box-shadow:0 16px 38px rgba(10,10,20,.09)}
.s-card .num{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;color:var(--s-accent);display:block;margin-bottom:14px}
.s-card b{font-family:var(--s-display);font-size:17px;font-weight:var(--s-hw2);display:block;margin-bottom:9px}
.s-card p{color:var(--s-muted);font-size:14px;margin:0;line-height:1.6}
.s-card .more{margin-top:16px;font-size:13px;color:var(--s-accent);font-weight:600;display:inline-block}
/* — galerie — */
.s-gal{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.s-gal .cell{border-radius:var(--s-r);overflow:hidden}
.s-gal .cell .ph{aspect-ratio:1;border-radius:0;height:100%;width:100%;transition:transform .6s ease}
.s-gal .cell:first-child{grid-column:span 2}
.s-gal .cell:first-child .ph{aspect-ratio:auto}
.s-gal .cell:hover .ph{transform:scale(1.045)}
/* — à propos — */
.s-about{display:grid;grid-template-columns:.85fr 1.15fr;gap:54px;align-items:center}
.s-about .imgwrap .ph{aspect-ratio:3/4;max-height:410px}
.s-about p{color:var(--s-muted);font-size:15.5px}
.s-sign{margin-top:22px;font-family:var(--f-display);font-style:italic;font-size:17px}
/* la phrase du client, mise en exergue : c'est son intention, pas notre texte */
.s-passion{margin:24px 0 0;padding:0 0 0 20px;border-left:2px solid var(--s-accent);
  font-family:var(--s-display);font-size:clamp(16px,2.2cqw,20px);line-height:1.45;color:var(--s-ink);font-weight:var(--s-hw2)}
.s-about.v-centre .s-passion{border-left:none;border-top:2px solid var(--s-accent);padding:20px 0 0;
  margin-left:auto;margin-right:auto;max-width:34ch}
/* — carte (restaurant) — */
.s-menu{max-width:620px;margin:0 auto;background:var(--s-card);border:1px solid var(--s-line);border-radius:var(--s-r);padding:36px 40px}
.s-menu .s-shead{text-align:center;margin:0 auto 10px}
.s-menu .s-kicker{justify-content:center}
.s-menu-cat{font-family:var(--s-display);font-size:17px;margin:26px 0 12px;color:var(--s-accent);font-weight:var(--s-hw2);text-align:center;letter-spacing:.04em}
.s-menu-item{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px dotted var(--s-line);font-size:14.5px}
.s-menu-item b{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--s-accent)}
/* — témoignages — */
.s-testi{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.s-quote{background:var(--s-card);border:1px solid var(--s-line);border-radius:var(--s-r);padding:28px}
.s-quote .stars{color:var(--s-accent);letter-spacing:3px;font-size:11.5px;margin-bottom:14px}
.s-quote p{font-family:var(--s-display);font-size:16.5px;line-height:1.55;margin:0 0 18px;font-style:italic;font-weight:var(--s-hw2)}
.s-qa{display:flex;gap:11px;align-items:center}
.s-ava{width:34px;height:34px;border-radius:50%;flex:none;background:color-mix(in srgb,var(--s-accent) 16%,var(--s-card));
  color:var(--s-accent);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;letter-spacing:.03em}
.s-qa span{font-size:13px;color:var(--s-muted)}
/* — contact — */
.s-contactgrid{display:grid;grid-template-columns:.9fr 1.1fr;gap:50px;align-items:start}
.s-info{display:flex;flex-direction:column;gap:16px}
.s-info .row{display:flex;gap:14px;align-items:baseline;font-size:14.5px}
.s-info .lab{font-family:var(--f-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--s-accent);width:82px;flex:none}
.s-info .row.empty span:last-child{color:var(--s-muted);font-style:italic}
.s-form{background:var(--s-card);border:1px solid var(--s-line);border-radius:var(--s-r);padding:26px;display:flex;flex-direction:column;gap:12px}
.s-form input,.s-form textarea{border:1px solid var(--s-line);background:var(--s-bg);border-radius:var(--s-rb);
  padding:12px 14px;font-size:14px;color:var(--s-muted);pointer-events:none;font-family:var(--f-ui);resize:none}
.s-form .s-cta{text-align:center;margin-top:4px}
/* — footer — */
.s-foot{padding:52px 7% 0;border-top:1px solid var(--s-line)}
.s-fgrid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:36px;padding-bottom:36px}
.s-fbrand{font-family:var(--s-display);font-size:19px;margin-bottom:10px;font-weight:var(--s-hw2)}
.s-foot p{color:var(--s-muted);font-size:13.5px;line-height:1.7;margin:0}
.s-ftitle{font-family:var(--f-mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--s-accent);margin-bottom:14px}
.s-flist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.s-flist li{color:var(--s-muted);font-size:13.5px}
.socialchip{border:1px solid var(--s-line);border-radius:99px;padding:5px 13px;font-size:12px;margin:10px 8px 0 0;display:inline-block;color:var(--s-ink)}
.s-fbottom{border-top:1px solid var(--s-line);padding:18px 0;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
  font-size:12px;color:var(--s-muted)}
@container (max-width:640px){
  .s-hero,.s-about,.s-contactgrid{grid-template-columns:1fr;gap:28px}
  .s-cards,.s-testi{grid-template-columns:1fr}
  .s-gal{grid-template-columns:1fr 1fr}
  .s-gal .cell:first-child{grid-column:span 2}
  .s-fgrid{grid-template-columns:1fr;gap:26px}
  .s-nav span:nth-child(n+3){display:none}
  .s-navcta{display:none}
  .s-sec{padding:44px 7%}
  .s-menu{padding:26px 22px}
}
/* — thème MODERNE : net, contrasté, direct — */
.site--moderne{--s-bg:#FFFFFF;--s-ink:#0F1115;--s-muted:#59606C;--s-line:#EAECEF;--s-card:#F8F9FB;
  --s-display:var(--f-ui);--s-body:var(--f-ui);--s-hw:800;--s-hw2:700;--s-r:4px;--s-rb:6px;--s-cta-ink:#fff;--s-hls:-.025em}
.site--moderne.pal-0{--s-accent:#2B44D8}.site--moderne.pal-1{--s-accent:#0E7A5F}.site--moderne.pal-2{--s-accent:#E2492F}
.site--moderne .s-h2::after{content:'';display:block;width:46px;height:4px;background:var(--s-accent);margin-top:14px}
.site--moderne .s-hero .imgwrap::after{content:'';position:absolute;top:20px;right:-20px;width:100%;height:100%;
  background:color-mix(in srgb,var(--s-accent) 10%,transparent);border-radius:var(--s-r);z-index:0}
/* — thème ÉLÉGANT : profond, serif, précieux — */
.site--elegant{--s-bg:#16171C;--s-ink:#EDEAE0;--s-muted:#98959E;--s-line:#2A2B33;--s-card:#1D1E25;
  --s-display:var(--f-display);--s-body:var(--f-ui);--s-hw:400;--s-hw2:500;--s-r:2px;--s-rb:2px;--s-cta-ink:#141519;--s-hls:.005em}
.site--elegant.pal-0{--s-accent:#C2A566}.site--elegant.pal-1{--s-accent:#B07156}.site--elegant.pal-2{--s-accent:#A9B4C8}
.site--elegant .s-sec{padding:80px 8%}
.site--elegant .s-kicker::after{content:'';width:26px;height:1px;background:var(--s-accent)}
.site--elegant .imgwrap::after{content:'';position:absolute;inset:-11px;border:1px solid color-mix(in srgb,var(--s-accent) 40%,transparent);z-index:0}
.site--elegant .s-shead{margin-left:auto;margin-right:auto;text-align:center}
.site--elegant .s-shead .s-kicker{justify-content:center}
.site--elegant .s-h2::after{content:'◆';display:block;font-size:7px;color:var(--s-accent);margin-top:18px}
.site--elegant .s-cta{box-shadow:none}
/* — thème CHALEUREUX : rond, chaud, accueillant — */
.site--chaleureux{--s-bg:#FBF5ED;--s-ink:#39302A;--s-muted:#8B7B6D;--s-line:#EDDFD0;--s-card:#FFFFFF;
  --s-display:var(--f-ui);--s-body:var(--f-ui);--s-hw:750;--s-hw2:700;--s-r:18px;--s-rb:99px;--s-cta-ink:#fff;--s-hls:-.01em}
.site--chaleureux.pal-0{--s-accent:#C4622D}.site--chaleureux.pal-1{--s-accent:#7C8A3A}.site--chaleureux.pal-2{--s-accent:#B98A2E}
.site--chaleureux .s-kicker{background:color-mix(in srgb,var(--s-accent) 12%,transparent);padding:5px 13px;border-radius:99px;width:max-content}
.site--chaleureux .s-kicker::before{display:none}
.site--chaleureux .s-hero .imgwrap .ph{border-radius:24px 90px 24px 24px}
.site--chaleureux .s-hero .imgwrap::after{content:'';position:absolute;inset:14px -16px -16px 14px;
  background:color-mix(in srgb,var(--s-accent) 15%,transparent);border-radius:24px 90px 24px 24px;z-index:0}
/* — thème MINIMAL : blanc, fin, essentiel — */
.site--minimal{--s-bg:#FFFFFF;--s-ink:#151515;--s-muted:#8C8C8C;--s-line:#EEEEEE;--s-card:#FFFFFF;
  --s-display:var(--f-ui);--s-body:var(--f-ui);--s-hw:300;--s-hw2:500;--s-r:0px;--s-rb:0px;--s-cta-ink:#fff;--s-hls:-.02em}
.site--minimal.pal-0{--s-accent:#1A1A1A}.site--minimal.pal-1{--s-accent:#24324F}.site--minimal.pal-2{--s-accent:#6E2B33}
.site--minimal .s-sec{border-top:1px solid var(--s-line);padding:72px 7%}
.site--minimal .s-hero h1{font-size:clamp(34px,6cqw,58px)}
.site--minimal .s-card{border:none;border-top:1px solid var(--s-line);border-radius:0;padding:24px 0;background:transparent}
.site--minimal .s-card:hover{transform:none;box-shadow:none}
.site--minimal .s-cta{box-shadow:none}
.site--minimal .imgwrap::after{display:none}
/* ============ VARIANTES DE MISE EN PAGE ============
   Indépendantes du thème : n'importe quelle structure se combine à n'importe quelle peau. */
/* — hero — */
.s-hero.v-miroir .hcontent{order:2}
.s-hero.v-miroir .imgwrap{order:1}
.s-hero.v-centre{grid-template-columns:1fr;gap:40px;text-align:center}
.s-hero.v-centre .lead{margin-left:auto;margin-right:auto}
.s-hero.v-centre .s-kicker,.s-hero.v-centre .s-ctarow,.s-hero.v-centre .s-trust{justify-content:center}
.s-hero.v-centre .imgwrap .ph{aspect-ratio:21/8}
.s-hero.v-couverture{grid-template-columns:1fr;gap:0;min-height:clamp(330px,46cqw,520px)}
.s-hero.v-couverture>*{grid-area:1/1}
.s-hero.v-couverture .imgwrap{height:100%}
.s-hero.v-couverture .imgwrap .ph{height:100%;width:100%;aspect-ratio:auto}
.s-hero.v-couverture .imgwrap::after{display:none}
.s-hero.v-couverture .hcontent{position:relative;z-index:2;align-self:end;padding:clamp(22px,4cqw,46px);max-width:44em}
.s-hero.v-couverture .hcontent::before{content:'';position:absolute;inset:0;border-radius:var(--s-r);z-index:-1;
  background:linear-gradient(to top,rgba(8,9,14,.88),rgba(8,9,14,.32) 64%,transparent)}
.s-hero.v-couverture h1,.s-hero.v-couverture .lead,.s-hero.v-couverture .s-cta2{color:#F7F6F3}
.s-hero.v-couverture .s-trust{border-top-color:rgba(255,255,255,.24)}
.s-hero.v-couverture .s-trust span{color:rgba(247,246,243,.84)}
.s-hero.v-editorial{grid-template-columns:1fr}
.s-hero.v-editorial .imgwrap{display:none}
.s-hero.v-editorial .hcontent{display:grid;grid-template-columns:1.15fr .85fr;column-gap:clamp(24px,4cqw,54px);row-gap:16px;align-items:end}
.s-hero.v-editorial .s-kicker{grid-column:1/-1;margin-bottom:0}
.s-hero.v-editorial h1{grid-column:1;grid-row:2;font-size:clamp(34px,7cqw,74px);margin:0}
.s-hero.v-editorial .lead{grid-column:2;grid-row:2;margin:0}
.s-hero.v-editorial .s-ctarow{grid-column:2;grid-row:3}
.s-hero.v-editorial .s-trust{grid-column:1/-1;grid-row:4}
/* ===== HEROS ÉDITORIAUX =====
   La typographie devient l'image : le nom occupe l'écran, les photos l'entourent.
   Réservés aux métiers visuels — un plombier a besoin de « devis gratuit » au-dessus de la ligne de flottaison. */
.s-titan,.s-collage{display:none}
.s-titan{font-family:var(--s-display);font-weight:var(--s-hw);line-height:.82;letter-spacing:-.035em;
  text-transform:uppercase;color:var(--s-ink);pointer-events:none}
/* --n = longueur du mot le plus long. Chaque variante ne règle que --titan-max :
   le plafond lié à la longueur s'applique toujours, un nom long ne peut pas déborder. */
.s-titan{--titan-max:clamp(40px,15.5cqw,200px)}
/* pas de nowrap : si le calcul se trompe malgré tout, le nom passe à la ligne
   au lieu de sortir du cadre. Deux garde-fous valent mieux qu'un. */
.s-titan span{display:block;overflow-wrap:break-word;
  font-size:min(var(--titan-max), calc(78cqw / (var(--n,8) * 0.72)))}
.s-collage span{display:block;position:absolute;overflow:hidden;border-radius:var(--s-r)}
.s-collage .ph{height:100%;width:100%;aspect-ratio:auto;border-radius:0}
.s-collage .ph::after{content:none}

/* affiche : deux blocs de titre aux angles opposés, photos entre les deux */
.s-hero.v-affiche{grid-template-columns:minmax(0,1fr);gap:0;position:relative;min-height:clamp(360px,52cqw,620px);
  padding:0;align-items:stretch}
.s-hero.v-affiche .imgwrap,.s-hero.v-affiche .s-kicker,.s-hero.v-affiche h1,.s-hero.v-affiche .s-trust{display:none}
.s-hero.v-affiche .s-titan{display:block;position:relative;z-index:3;height:100%}
.s-hero.v-affiche .t-a{text-align:left}
.s-hero.v-affiche .t-b{text-align:right;margin-top:auto}
.s-hero.v-affiche .s-titan{display:flex;flex-direction:column;justify-content:space-between}
.s-hero.v-affiche .s-collage{display:block;position:absolute;inset:0;z-index:2}
.s-hero.v-affiche .s-collage .c1{top:6%;right:4%;width:19%;height:30%}
.s-hero.v-affiche .s-collage .c2{top:34%;left:6%;width:17%;height:27%}
.s-hero.v-affiche .s-collage .c3{top:26%;left:28%;width:30%;height:52%}
.s-hero.v-affiche .s-collage .c4{display:none}
.s-hero.v-affiche .hcontent{position:absolute;left:0;bottom:16%;z-index:4;max-width:30ch;padding:0}
.s-hero.v-affiche .lead{font-size:12.5px;text-transform:uppercase;letter-spacing:.1em;line-height:1.6;margin:0 0 14px;max-width:32ch}
.s-hero.v-affiche .s-ctarow{gap:12px}
.s-hero.v-affiche .s-cta{padding:10px 20px;font-size:13px}
.s-hero.v-affiche .s-cta2{font-size:12px}

/* collage : le nom au centre, les photos autour et par-dessus */
.s-hero.v-collage{grid-template-columns:minmax(0,1fr);gap:0;position:relative;min-height:clamp(340px,50cqw,600px);align-items:center}
.s-hero.v-collage .imgwrap,.s-hero.v-collage h1,.s-hero.v-collage .s-trust,.s-hero.v-collage .s-kicker{display:none}
.s-hero.v-collage .s-titan{display:flex;position:relative;z-index:3;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;letter-spacing:-.02em;text-transform:none}
.s-hero.v-collage .s-titan{--titan-max:clamp(38px,13cqw,168px)}
.s-hero.v-collage .t-b{margin-top:-.12em}
.s-hero.v-collage .s-collage{display:block;position:absolute;inset:0;z-index:2}
.s-hero.v-collage .c1{top:2%;left:20%;width:17%;height:30%}
.s-hero.v-collage .c2{top:20%;right:3%;width:20%;height:26%}
.s-hero.v-collage .c3{bottom:4%;left:4%;width:19%;height:32%;z-index:4}
.s-hero.v-collage .c4{bottom:8%;right:16%;width:16%;height:28%;z-index:4}
.s-hero.v-collage .hcontent{position:absolute;left:0;right:0;bottom:2%;z-index:5;text-align:center;padding:0;
  display:flex;flex-direction:column;align-items:center;gap:10px}
.s-hero.v-collage .lead{display:none}
.s-hero.v-collage .s-cta{padding:10px 22px;font-size:13px}

/* signature : le nom seul, énorme, puis une bande d'image pleine largeur */
.s-hero.v-signature{grid-template-columns:minmax(0,1fr);gap:clamp(20px,3cqw,38px);text-align:center;position:relative}
.s-hero.v-signature h1,.s-hero.v-signature .s-trust{display:none}
.s-hero.v-signature .s-titan{display:block;text-align:center;letter-spacing:-.045em}
.s-hero.v-signature .s-titan{--titan-max:clamp(40px,17cqw,225px)}
.s-hero.v-signature .t-b{opacity:.34}
.s-hero.v-signature .hcontent{order:1;display:flex;flex-direction:column;align-items:center;gap:12px;padding:0;min-width:0}
.s-hero.v-signature .s-ctarow{justify-content:center}
.s-hero.v-signature .s-kicker{justify-content:center;order:-1;margin:0}
.s-hero.v-signature .lead{max-width:40ch;margin:0;font-size:14.5px}
.s-hero.v-signature .imgwrap{order:3}
.s-hero.v-signature .imgwrap .ph{aspect-ratio:21/7}
.s-hero.v-signature .imgwrap::after{display:none}

/* — services — */
.s-cards.v-rangees{display:block}
.s-cards.v-rangees .s-card{display:grid;grid-template-columns:auto minmax(130px,1fr) 2fr;gap:clamp(14px,3cqw,40px);
  align-items:start;background:transparent;border:none;border-top:1px solid var(--s-line);border-radius:0;padding:24px 0}
.s-cards.v-rangees .s-card:hover{transform:none;box-shadow:none}
.s-cards.v-rangees .num{margin:0;padding-top:5px}
.s-cards.v-rangees b{margin:0}
.s-cards.v-rangees .more{grid-column:3;margin-top:10px}
.s-cards.v-liste{display:flex;flex-direction:column;gap:0}
.s-cards.v-liste .s-card{background:transparent;border:none;border-bottom:1px solid var(--s-line);border-radius:0;padding:26px 0;
  display:grid;grid-template-columns:auto 1fr;column-gap:clamp(18px,3cqw,40px);align-items:baseline}
.s-cards.v-liste .s-card:hover{transform:none;box-shadow:none}
.s-cards.v-liste .num{font-family:var(--s-display);font-size:clamp(26px,4.4cqw,46px);letter-spacing:0;line-height:1;
  color:color-mix(in srgb,var(--s-accent) 38%,transparent);margin:0;grid-row:span 3}
.s-cards.v-liste b{font-size:clamp(17px,2.4cqw,23px)}
.s-cards.v-tuiles{grid-template-columns:repeat(2,1fr)}
.s-cards.v-tuiles .s-card:first-child{background:var(--s-accent);border-color:var(--s-accent)}
.s-cards.v-tuiles .s-card:first-child b{color:var(--s-cta-ink)}
.s-cards.v-tuiles .s-card:first-child .num,.s-cards.v-tuiles .s-card:first-child p,
.s-cards.v-tuiles .s-card:first-child .more{color:color-mix(in srgb,var(--s-cta-ink) 84%,transparent)}
/* — galerie — */
.s-gal.v-bande .cell:nth-child(n+4){display:none}
.s-gal.v-bande .cell:first-child{grid-column:auto}
.s-gal.v-bande .cell .ph{aspect-ratio:3/4.2}
.s-gal.v-vitrine{grid-template-columns:repeat(4,1fr)}
.s-gal.v-vitrine .cell:first-child{grid-column:span 2;grid-row:span 2}
.s-gal.v-vitrine .cell:first-child .ph{aspect-ratio:auto;height:100%}
/* — à propos — */
.s-about.v-miroir .imgwrap{order:2}
.s-about.v-centre{grid-template-columns:1fr;text-align:center;max-width:68ch;margin:0 auto}
.s-about.v-centre .imgwrap{display:none}
.s-about.v-centre .s-shead{margin-left:auto;margin-right:auto}
.s-about.v-centre .s-kicker{justify-content:center}
/* — rythme : alternance des fonds de section — */
.site.ryt-1 .s-sec:nth-of-type(even){background:var(--s-alt)}
/* en largeur tablette, la navigation perd ses derniers liens plutôt que de déborder
   (les typographies très espacées, comme celle de Studio, dépassent sinon) */
@container (max-width:900px){
  .s-nav{gap:18px;font-size:12.5px}
  .s-nav span:nth-child(n+4):not(.s-navcta){display:none}
}
@container (max-width:640px){
  /* les collages perdent leurs photos les plus étroites : illisibles sous 640 px */
  .s-hero.v-affiche{min-height:clamp(300px,88cqw,420px)}
  .s-hero.v-affiche .s-collage .c1{width:26%;height:22%}
  .s-hero.v-affiche .s-collage .c2{display:none}
  .s-hero.v-affiche .s-collage .c3{left:34%;width:40%;height:34%}
  .s-hero.v-affiche .hcontent{bottom:20%}
  .s-hero.v-affiche .lead{font-size:11px;max-width:26ch}
  .s-hero.v-collage{min-height:clamp(300px,92cqw,440px)}
  .s-hero.v-collage .c1{left:4%;width:26%;height:20%}
  .s-hero.v-collage .c2{right:2%;width:26%;height:20%}
  .s-hero.v-collage .c3{width:28%;height:21%}
  .s-hero.v-collage .c4{display:none}
  .s-hero.v-signature .s-titan{--titan-max:clamp(34px,19cqw,90px)}
  .s-hero.v-editorial .hcontent{grid-template-columns:1fr}
  .s-hero.v-editorial h1,.s-hero.v-editorial .lead,.s-hero.v-editorial .s-ctarow,.s-hero.v-editorial .s-trust{grid-column:1;grid-row:auto}
  .s-cards.v-rangees .s-card,.s-cards.v-liste .s-card{grid-template-columns:1fr}

/* =====================================================================
   CONFIGURATION — à renseigner après la création du projet Supabase.
   Tant que ces champs sont vides, tout fonctionne en mémoire :
   le fichier s'ouvre et se teste en local, sans serveur.
   ===================================================================== */
const CONFIG = {
  supabaseUrl: 'https://nxulgsfttbkzyzqbmthg.supabase.co',
  // Clé « publishable » (ex-« anon public ») : publique par conception,
  // ce sont les règles RLS qui protègent, pas son secret.
  supabaseAnonKey: 'sb_publishable_9b0z0lOSqf-wU2r-G1AVQw_L_4hn-ok',
  apiBase: '',            // '' = même domaine une fois en ligne
  turnstileSiteKey: '',   // clé publique Turnstile, à renseigner

  // Le mode en ligne ne s'active que sur le site déployé. Ouvert en local (file://)
  // ou depuis un aperçu partagé, le prototype reste en mémoire : la démonstration
  // fonctionne partout, sans jamais écrire dans la vraie base.
  // ⚠️ Ajouter ici votre nom de domaine définitif le jour où vous l'achetez.
  hotesEnLigne: ['.vercel.app', 'localhost', '127.0.0.1'],
};
const surHoteEnLigne = () => CONFIG.hotesEnLigne.some(h =>
  h.startsWith('.') ? location.hostname.endsWith(h) : location.hostname === h);
const enLigne = () => !!(CONFIG.supabaseUrl && CONFIG.supabaseAnonKey) && surHoteEnLigne();

/* ---------------------------------------------------------------------
   Accès Supabase par l'API REST, sans bibliothèque externe :
   aucune dépendance à charger, rien à compiler.
   --------------------------------------------------------------------- */
const SB = {
  session: null,   // { access_token, email }

  entetes(avecJeton = true) {
    const h = { apikey: CONFIG.supabaseAnonKey, 'Content-Type': 'application/json' };
    if (avecJeton && this.session) h.Authorization = `Bearer ${this.session.access_token}`;
    return h;
  },

  async connexion(email, motDePasse) {
    const r = await fetch(`${CONFIG.supabaseUrl}/auth/v1/token?grant_type=password`, {
      method: 'POST', headers: this.entetes(false),
      body: JSON.stringify({ email, password: motDePasse }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error_description || d.msg || 'Identifiants refusés');
    this.session = { access_token: d.access_token, email: d.user?.email || email };
    try { sessionStorage.setItem('socle.session', JSON.stringify(this.session)); } catch {}
    return this.session;
  },

  deconnexion() {
    this.session = null;
    try { sessionStorage.removeItem('socle.session'); } catch {}
  },

  // la session vit le temps de l'onglet : rien ne subsiste sur un poste partagé
  restaurer() {
    try {
      const s = sessionStorage.getItem('socle.session');
      if (s) this.session = JSON.parse(s);
    } catch {}
    return this.session;
  },

  async requete(chemin, options = {}) {
    const r = await fetch(`${CONFIG.supabaseUrl}/rest/v1/${chemin}`, {
      ...options,
      headers: { ...this.entetes(), ...(options.headers || {}) },
    });
    if (r.status === 401) { this.deconnexion(); throw new Error('Session expirée, reconnectez-vous'); }
    if (!r.ok) throw new Error(`Supabase ${r.status} : ${(await r.text()).slice(0, 200)}`);
    return r.status === 204 ? null : r.json();
  },
};

function readADN(slug, phrase, contexte){
  const adn = {}; TRAITS.forEach(t=>adn[t]=0);
  Object.assign(adn, {...adn, ...(ADN_BASE[slug]||ADN_BASE.generique)});
  const compte = (txt, poids)=>{ const s = String(txt||'').toLowerCase();
    for(const t of TRAITS) for(const mot of LEXIQUE[t]) if(s.includes(mot)) { adn[t] += poids; break; } };
  compte(phrase, 4);     // sa phrase : le signal le plus personnel, donc le plus lourd
  compte(contexte, 1);   // sa spécialité : un appoint, pas un verdict
  return adn;
}

  return TRAITS.filter(t=>adn[t]>0).sort((a,b)=>adn[b]-adn[a]).slice(0,n).map(t=>TRAIT_MOT[t]);

function empreinte(st){
  const src = [st.name, st.metierLabel, st.specialization, st.goal, st.diff].join('|').toLowerCase();
  let h = 2166136261;
  for(let i=0;i<src.length;i++){ h ^= src.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

/* ================= IMAGES =================
   Les URL blob (URL.createObjectURL) meurent au rechargement de la page :

   redimensionnant au passage — le poids envoyé au serveur s'en trouve divisé

const TAILLES = { logo:{cote:512, jpeg:false}, photo:{cote:1600, jpeg:true} };

function imageEnDataURL(fichier, role='photo'){
  return new Promise((resolve, reject) => {
    // le SVG est du texte : on le garde intact, le rastériser le dégraderait
    if (fichier.type === 'image/svg+xml') {
      const fr = new FileReader();
      fr.onload = () => resolve(fr.result);
      fr.onerror = () => reject(new Error('Lecture impossible'));
      fr.readAsDataURL(fichier);
      return;
    }
    const reglage = TAILLES[role] || TAILLES.photo;
    const fr = new FileReader();
    fr.onerror = () => reject(new Error('Lecture impossible'));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Image illisible'));
      img.onload = () => {
        const k = Math.min(1, reglage.cote / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * k));
        const h = Math.max(1, Math.round(img.height * k));
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, 0, 0, w, h);
        // JPEG pour les photos ; PNG pour les logos, qui ont souvent un fond transparent
        resolve(reglage.jpeg ? c.toDataURL('image/jpeg', 0.82) : c.toDataURL('image/png'));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(fichier);
  });
}

/* ================= BROUILLON =================
   Le client peut fermer son onglet, être appelé, tomber en veille : il doit
   retrouver son travail. Rien ne part sur un serveur — tout reste dans SON
   navigateur, et le brouillon est effacé à l'envoi (règle métier : après envoi,
   la maquette n'est plus accessible au client). */
const BROUILLON_CLE = 'socle.brouillon.v1';
const BROUILLON_JOURS = 30;
const CHAMPS_BROUILLON = ['packSlug','metierLabel','specialization','name','theme','palette','fontPair',
  'goal','diff','layout','laySeed','adn','empreinte','site','comp','maxPct','email',
  'atelierPas','atelierFait','themeTouche','photosPassees','screen'];

// Évalué à la demande et mis en cache : le stockage peut être refusé
// (navigation privée, data: URL, réglage navigateur) sans que rien ne casse.
let _stockage = null;
function stockageOk(){
  if (_stockage === null) {
    try { const t='__socle_test'; localStorage.setItem(t,'1'); localStorage.removeItem(t); _stockage = true; }
    catch { _stockage = false; }
  }
  return _stockage;
}

function sauvegarderBrouillon(){
  if (!stockageOk() || S.submitted || !S.site) return;
  const donnees = {};
  for (const k of CHAMPS_BROUILLON) donnees[k] = S[k];
  const paquet = { v:1, date:Date.now(), etat:donnees };
  try {
    localStorage.setItem(BROUILLON_CLE, JSON.stringify(paquet));
  } catch {
    // quota dépassé : on retente sans les images plutôt que de tout perdre
    try {
      const sansImages = JSON.parse(JSON.stringify(paquet));
      sansImages.etat.site.logo = null;
      sansImages.etat.site.heroImg = null;
      sansImages.etat.site.gallery = sansImages.etat.site.gallery.map(()=>null);
      sansImages.imagesOmises = true;
      localStorage.setItem(BROUILLON_CLE, JSON.stringify(sansImages));
    } catch { /* stockage inutilisable : on continue sans brouillon */ }
  }
}
function lireBrouillon(){
  if (!stockageOk()) return null;
  try {
    const brut = localStorage.getItem(BROUILLON_CLE);
    if (!brut) return null;
    const p = JSON.parse(brut);
    if (!p || p.v !== 1 || !p.etat || !p.etat.site) return null;
    if (Date.now() - p.date > BROUILLON_JOURS*86400000) { effacerBrouillon(); return null; }
    return p;
  } catch { effacerBrouillon(); return null; }
}
function effacerBrouillon(){
  if (!stockageOk()) return;
  try { localStorage.removeItem(BROUILLON_CLE); } catch {}
}
function reprendreBrouillon(p){
  Object.assign(S, p.etat);
  if (!S.layout) refreshIdentity();
  S.submitted = false;
  const ecran = p.etat.screen;
  if (ecran === 'studio' || ecran === 'done' || ecran === 'verrouille') return enterStudio(
    p.imagesOmises ? 'Votre travail est retrouvé. Vos images étaient trop lourdes pour être conservées : à réimporter.'
                   : 'Vous reprenez où vous vous étiez arrêté.');
  if (ecran === 'atelier') return go('atelier');
  go(FLOW.includes(ecran) && ecran !== 'landing' ? ecran : 'metier');
}
// mémorise à chaque respiration du parcours, sans jamais bloquer l'interface
let brouillonT = null;
function planifierBrouillon(){
  clearTimeout(brouillonT);
  brouillonT = setTimeout(sauvegarderBrouillon, 600);
}
addEventListener('pagehide', sauvegarderBrouillon);
addEventListener('visibilitychange', ()=>{ if (document.hidden) sauvegarderBrouillon(); });

// construit le contenu d'un site pour n'importe quel métier — sert au parcours ET aux réalisations
function buildSiteFor(packSlug, specialization, goalId, diff){
  const p = PACKS[packSlug];
  const h = (p.hero[specialization] || p.hero.default);
  return {
    heroHeading:h[0],
    heroSub: diff ? (diff[0].toUpperCase()+diff.slice(1).replace(/\.?\s*$/,'.')) : h[1],
    cta:(p.goals.find(g=>g.id===goalId)||p.goals[0]).cta,
    services:(p.services||[]).map(s=>({...s})),
    menu:p.menu||null,
    about:p.about, aboutIdx:0,
    // la phrase du client devient une exergue dans « à propos » — son intention, textuelle
    passion: diff ? '« '+diff[0].toUpperCase()+diff.slice(1).replace(/\.?\s*$/,'')+' »' : '',
    testimonials:p.testimonials,
    gallery:[null,null,null,null,null,null], heroImg:null, logo:null, logoMode:'tel-quel',
    contact:{phone:'',email:'',address:'',hours:''},
    socials:{instagram:'',facebook:''},
    pages:[{slug:'accueil',label:'Accueil',reason:'La porte d’entrée de votre site.',on:true,lock:true},
      ...p.pages.map(pg=>({...pg,on:true,lock:false}))],
  };
}
function buildSite(){
  S.site = buildSiteFor(S.packSlug, S.specialization, S.goal, S.diff);
  refreshIdentity();
}
// relit l'ADN du projet et en déduit la composition — appelée dès qu'une réponse change
function refreshIdentity(){
  S.adn = adnFor(S);
  S.empreinte = empreinte(S);
  S.layout = pickLayout(S.packSlug, S.laySeed, S.adn, S.empreinte);
}

/* apparition des sections au défilement DANS la maquette.
   Calcul géométrique (pas d'IntersectionObserver) : déterministe, et jamais de section
   qui resterait invisible si l'observateur ne se déclenchait pas. */
// distance entre le haut d'une section et le haut visible du conteneur de défilement
function topInScroller(el, root){ return el.getBoundingClientRect().top - root.getBoundingClientRect().top; }
function revealVisibleSections(root){
  const limit = root.clientHeight * 0.94;
  root.querySelectorAll('.s-sec.pre').forEach(s=>{ if(topInScroller(s,root) < limit) s.classList.remove('pre'); });
}
function observeSections(root){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){
    root.querySelectorAll('.s-sec').forEach(s=>s.classList.remove('pre')); return; }
  const limit = (root.clientHeight || 600) * 0.94;
  root.querySelectorAll('.s-sec').forEach(s=>{ s.classList.toggle('pre', topInScroller(s,root) >= limit); });
  if(!root.dataset.revealBound){
    root.dataset.revealBound = '1';
    root.addEventListener('scroll', ()=>revealVisibleSections(root), {passive:true});
  }
  // filet : rien ne doit pouvoir rester invisible durablement
  setTimeout(()=>revealVisibleSections(root), 2000);
}

/* ================= NAVIGATION DU TUNNEL ================= */
const FLOW = ['landing','metier','spec','nom','univers','objectif','diff'];
function setProgress(){
  const i = FLOW.indexOf(S.screen);
  $('#progress').style.width = i<=0?'0%':(i/(FLOW.length))*88+'%';
}
/* ---- indicateur « il reste du contenu plus bas » ---- */
let cueRaf = null;
function updateScrollCue(){
  const cue = $('#scrollcue'); if(!cue) return;
  if(S.screen==='studio' && !isNarrow()){ cue.classList.remove('on'); return; }
  const doc = document.documentElement;
  const rest = doc.scrollHeight - innerHeight - scrollY;
  cue.classList.toggle('on', rest > 90);
}
addEventListener('scroll', ()=>{ cancelAnimationFrame(cueRaf); cueRaf = requestAnimationFrame(updateScrollCue); }, {passive:true});
addEventListener('resize', updateScrollCue);
$('#scrollcue').onclick = ()=> scrollBy({top: innerHeight*.8, behavior:'smooth'});

function swap(html, onMount){
  const stage = $('#stage'); stage.className='stage'; const cur = stage.firstElementChild;
  const doIn = ()=>{ stage.innerHTML = html; const sc = stage.firstElementChild;
    requestAnimationFrame(()=>requestAnimationFrame(()=>sc.classList.add('in')));
    onMount && onMount(); setProgress();
    scrollTo({top:0,behavior:'auto'});          // chaque écran démarre en haut
    setTimeout(updateScrollCue, 60);
    const f = stage.querySelector('[autofocus]'); f && setTimeout(()=>f.focus(),320); };
  if(cur){ cur.classList.remove('in'); cur.classList.add('out'); setTimeout(doIn, matchMedia('(prefers-reduced-motion: reduce)').matches?0:230); }
  else doIn();
}
function go(screen){ S.screen = screen; SCREENS[screen](); planifierBrouillon(); }

async function reveal(){
  $('#progress').style.width='94%';
  const veil = $('#veil'), status = $('#revealStatus'), ring = $('#ringFg');
  veil.classList.add('on');
  const steps = [
    ['Analyse de votre activité — '+(S.metierLabel||pack().label).toLowerCase(),18],
    ['Construction de la structure de votre site',42],
    ['Application de votre univers « '+THEMES.find(t=>t[0]===S.theme)[1]+' »',66],
    ['Rédaction de vos premiers textes',88],
    ['Assemblage de votre maquette',100]];
  for(const [txt,pct] of steps){ status.textContent = txt; ring.style.strokeDashoffset = 213-(213*pct/100); await sleep(720); }
  // scène : le site se construit
  $('#stage').innerHTML = `<div class="screen in" style="max-width:1100px;width:100%">
    <p class="eyebrow" id="revealCap" style="opacity:0;transition:opacity .5s">Voici la maquette de départ de votre site.</p>
    <div class="frame-wrap"><div class="frame-bar"><i></i><i></i><i></i></div>
    <div class="frame-holder"><div class="frame" style="width:100%"><div class="site-scroll" id="revealSite">${renderSite({hidden:true})}</div></div></div></div>
  </div>`;
  veil.classList.remove('on');
  await sleep(500);
  const secs = document.querySelectorAll('#revealSite .s-sec');
  const heroH1 = document.querySelector('#revealSite h1');
  // apparition séquencée + « frappe » du titre + streaming des textes
  const fullTitle = S.site.heroHeading;
  for(let i=0;i<secs.length;i++){
    secs[i].classList.remove('pre');
    if(i===0){
      if(!matchMedia('(prefers-reduced-motion: reduce)').matches && !document.hidden){
        heroH1.textContent='';
        for(const ch of fullTitle){ heroH1.textContent+=ch; if(document.hidden){heroH1.textContent=fullTitle;break;} await sleep(24); }
      }
      const sub = document.querySelector('#revealSite [data-bind=heroSub]');
      streamText(sub, S.site.heroSub);
      await sleep(500);
    } else {
      // on suit la construction : la maquette défile vers la section qui vient d'apparaître
      if(!document.hidden) secs[i].scrollIntoView({behavior:'smooth',block:'nearest'});
      await sleep(470);
    }
  }
  await sleep(400);
  const scroller = $('#revealSite');
  if(scroller){ scroller.querySelectorAll('.s-sec.pre').forEach(s=>s.classList.remove('pre'));
    scroller.scrollTo({top:0,behavior:document.hidden?'auto':'smooth'}); }
  $('#revealCap').style.opacity=1;
  await sleep(1000);
  $('#emailCard').classList.add('on');
}
function streamText(el, text){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){ el.textContent=text; return; }
  el.innerHTML = text.split(' ').map((w,i)=>`<span class="stream-w" style="animation-delay:${i*70}ms">${esc(w)}</span>`).join(' ');
}

/* Les accroches sont écrites du point de vue du VISITEUR, jamais du gérant :
   « Prenez rendez-vous quand cela vous arrange », pas « un agenda qui se remplit ». */
const ACCROCHE_BUT = {
  showcase:"Prenez le temps de regarder : chaque projet y raconte quelque chose de différent.",
  contact:"Un premier échange, sans engagement, pour voir ensemble ce dont vous avez besoin.",
  book:"Prenez rendez-vous en ligne, à l’heure qui vous arrange.",
  sell:"Des offres claires et sans surprise : choisissez simplement celle qui vous correspond.",
  found:"Adresse, horaires, accès : tout ce qu’il faut savoir avant de passer nous voir.",
  present:"Découvrez qui nous sommes, comment nous travaillons et ce que nous pouvons faire pour vous.",
  crave:"Une carte courte, des produits choisis, et l’envie de revenir.",
};
function propositionsAccroche(){
  const p = pack(), h = (p.hero[S.specialization] || p.hero.default);
  const but = (p.goals.find(g=>g.id===S.goal) || p.goals[0]);
  const liste = [];
  if(S.diff) liste.push({t:S.diff[0].toUpperCase()+S.diff.slice(1).replace(/\.?\s*$/,'.'), lab:'Vos mots'});
  liste.push({t:h[1], lab:'Notre proposition'});
  if(ACCROCHE_BUT[but.id]) liste.push({t:ACCROCHE_BUT[but.id], lab:'Tournée vers l’action'});
  liste.push({t:`${S.name} accompagne chaque client avec exigence et simplicité, de la première question au résultat final.`, lab:'Rassurante'});
  return liste.filter((x,i,a)=>a.findIndex(y=>y.t===x.t)===i).slice(0,3);
}

// rend une seule section, pour les aperçus de l'atelier
function sectionSeule(section, L){
  const html = renderSite({layout:L});
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const cible = {hero:'hero', services:'services', about:'apropos'}[section];
  const sec = doc.querySelector(`[data-sec="${cible}"]`);
  const site = doc.querySelector('.site');
  if(!sec || !site) return html;
  site.innerHTML = '';
  site.appendChild(sec);
  return site.outerHTML;
}
